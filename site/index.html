<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* ?gl=<flags> — диагностика рендера на капризных мобильных GPU (панель с инфой + переключатели):
   1 — WebGL1, t — кости во float-текстуре (по умолчанию uniform-массив, если хватает uniform'ов), b — модели без освещения,
   f — модели односторонние, m — текстуры моделей без мипмапов, p — mediump вместо highp */
const GLQ = new URLSearchParams(location.search).get('gl');
const glf = c => GLQ != null && GLQ.includes(c);
const ASSETS = {
  bsp: "assets/bsp.gz",
  gopnik: ["assets/gopnik_0.gz", "assets/gopnik_1.gz"],
  ghost: ["assets/ghost_0.gz", null],
  troll: ["assets/troll_0.gz", null],
  olivie: ["assets/olivie_0.gz", null],
  seledka: ["assets/seledka_0.gz", null],
  crab: ["assets/crab_0.gz", null],
  hleb: ["assets/hleb_0.gz", null],
  fruit: ["assets/fruit_0.gz", null],
  bottle1: ["assets/bottle1_0.gz", null],
  bottle5: ["assets/bottle5_0.gz", null],
  bokal: ["assets/bokal_0.gz", null],
  elka: ["assets/elka_0.gz", null],
  sistemnik: ["assets/sistemnik_0.gz"],
  kreslo: ["assets/kreslo_0.gz", null],
};

async function gunzip(v) {
  // ассеты лежат файлами assets/*.gz (их кеширует браузер). Если хостинг отдал их с Content-Encoding: gzip,
  // браузер уже распаковал сам — тогда в начале нет сигнатуры gzip 1f 8b, и распаковывать второй раз не надо
  const r = await fetch(v);
  if (!r.ok) throw new Error(`${v}: HTTP ${r.status}`);
  const buf = await r.arrayBuffer(), b = new Uint8Array(buf, 0, 2);
  if (b[0] !== 0x1f || b[1] !== 0x8b) return buf;
  return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
}
(async () => {
{ const bootEl = document.getElementById('boot'), keys = Object.keys(ASSETS); let done = 0;
  const tick = r => { done++; bootEl.textContent = `загружаю карту… ${done}/${keys.length}`; return r; };
  await Promise.all(keys.map(async k => { ASSETS[k] = Array.isArray(ASSETS[k]) ? await Promise.all(ASSETS[k].map(v => v && gunzip(v))) : await gunzip(ASSETS[k]); tick(); })); }
/* ================= GoldSrc BSP v30 → three.js, with baked lightmaps ================= */
const GS = 1 / 40; // GoldSrc units → metres-ish (72-unit player ≈ 1.8 m)
const gsToThree = (x, y, z) => [x * GS, z * GS, -y * GS];

function b64bytes(b64) { if (b64 instanceof ArrayBuffer) return b64; const s = atob(b64), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; }

function parseEntities(txt) {
  const out = [];
  for (const blk of txt.match(/\{[^}]*\}/g) || []) {
    const e = {}; for (const m of blk.matchAll(/"([^"]*)"\s+"([^"]*)"/g)) e[m[1]] = m[2]; out.push(e);
  }
  return out;
}

function decodeMiptex(dv, base) {
  const u8 = new Uint8Array(dv.buffer);
  let name = ''; for (let i = 0; i < 16 && u8[base + i]; i++) name += String.fromCharCode(u8[base + i]);
  const w = dv.getUint32(base + 16, true), h = dv.getUint32(base + 20, true), o0 = dv.getUint32(base + 24, true), o3 = dv.getUint32(base + 36, true);
  if (!o0) return { name, w, h, rgba: null };
  const pal = base + o3 + (w >> 3) * (h >> 3) + 2, rgba = new Uint8ClampedArray(w * h * 4), cut = name[0] === '{';
  for (let i = 0; i < w * h; i++) {
    const c = u8[base + o0 + i], p = pal + c * 3;
    rgba[i * 4] = u8[p]; rgba[i * 4 + 1] = u8[p + 1]; rgba[i * 4 + 2] = u8[p + 2]; rgba[i * 4 + 3] = cut && c === 255 ? 0 : 255;
  }
  return { name, w, h, rgba };
}

function loadBSP(buffer, opts = {}) {
  const dv = new DataView(buffer), u8 = new Uint8Array(buffer);
  const L = i => ({ o: dv.getInt32(4 + i * 8, true), l: dv.getInt32(8 + i * 8, true) });
  const [ENT, , TEX, VERT, , , TINFO, FACE, LIGHT, , , , EDGE, SEDGE, MODEL] = Array.from({ length: 15 }, (_, i) => L(i));
  const ents = parseEntities(new TextDecoder('latin1').decode(u8.subarray(ENT.o, ENT.o + ENT.l)));

  // textures
  const ntex = dv.getInt32(TEX.o, true), textures = [];
  for (let i = 0; i < ntex; i++) {
    const off = dv.getInt32(TEX.o + 4 + i * 4, true);
    const m = off < 0 ? { name: '', w: 16, h: 16, rgba: null } : decodeMiptex(dv, TEX.o + off);
    let map = null;
    if (m.rgba) {
      const c = document.createElement('canvas'); c.width = m.w; c.height = m.h;
      c.getContext('2d').putImageData(new ImageData(m.rgba, m.w, m.h), 0, 0);
      map = new THREE.CanvasTexture(c);
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.magFilter = THREE.LinearFilter; map.minFilter = THREE.LinearMipmapLinearFilter; map.anisotropy = 4;
      map.encoding = THREE.sRGBEncoding; map.flipY = false;
    }
    textures.push({ ...m, map });
  }

  const vert = i => [dv.getFloat32(VERT.o + i * 12, true), dv.getFloat32(VERT.o + i * 12 + 4, true), dv.getFloat32(VERT.o + i * 12 + 8, true)];
  const tinfo = i => { const o = TINFO.o + i * 40, f = k => dv.getFloat32(o + k * 4, true); return { s: [f(0), f(1), f(2), f(3)], t: [f(4), f(5), f(6), f(7)], tex: dv.getInt32(o + 32, true), flags: dv.getInt32(o + 36, true) }; };

  // which model index each face belongs to, and the entity that owns the model
  const nmodels = MODEL.l / 64, faceOwner = new Map();
  const modelEnt = {}; ents.forEach(e => { if (e.model && e.model[0] === '*') modelEnt[+e.model.slice(1)] = e; });
  for (let m = 0; m < nmodels; m++) {
    const o = MODEL.o + m * 64, first = dv.getInt32(o + 56, true), num = dv.getInt32(o + 60, true);
    for (let f = first; f < first + num; f++) faceOwner.set(f, m);
  }

  // gather faces, compute lightmap sizes
  const SKIP = /^(sky|aaatrigger|clip|origin|hint|skip|null|bevel|solidhint)$/i;
  const faces = [], nfaces = FACE.l / 20;
  for (let f = 0; f < nfaces; f++) {
    const o = FACE.o + f * 20;
    const firstedge = dv.getInt32(o + 4, true), numedges = dv.getUint16(o + 8, true), ti = dv.getUint16(o + 10, true);
    const style0 = u8[o + 12], lightofs = dv.getInt32(o + 16, true);
    const T = tinfo(ti), tex = textures[T.tex];
    const model = faceOwner.get(f) ?? 0, ent = modelEnt[model];
    if (SKIP.test(tex.name)) continue;
    if (ent && /^(func_ladder|func_buyzone|func_bomb_target|trigger_|func_hostage_rescue)/.test(ent.classname)) continue;
    const pts = [];
    for (let e = 0; e < numedges; e++) {
      const se = dv.getInt32(SEDGE.o + (firstedge + e) * 4, true);
      const vi = se >= 0 ? dv.getUint16(EDGE.o + se * 4, true) : dv.getUint16(EDGE.o + (-se) * 4 + 2, true);
      pts.push(vert(vi));
    }
    let smin = 1e9, smax = -1e9, tmin = 1e9, tmax = -1e9;
    const st = pts.map(p => {
      const s = p[0] * T.s[0] + p[1] * T.s[1] + p[2] * T.s[2] + T.s[3], t = p[0] * T.t[0] + p[1] * T.t[1] + p[2] * T.t[2] + T.t[3];
      smin = Math.min(smin, s); smax = Math.max(smax, s); tmin = Math.min(tmin, t); tmax = Math.max(tmax, t); return [s, t];
    });
    const bs = [Math.floor(smin / 16), Math.floor(tmin / 16)], lw = Math.ceil(smax / 16) - bs[0] + 1, lh = Math.ceil(tmax / 16) - bs[1] + 1;
    // let the caller push vertices around. Texture uv is derived from the vertex, so moving an edge crops
    // the texture instead of squashing it; the lightmap grid stays exactly as the compiler baked it
    // (bs/lw/lh are already fixed above), only the point the face reads it at follows the vertex.
    if (opts.move && opts.move(pts, tex.name)) pts.forEach((p, i) => {
      st[i] = [p[0] * T.s[0] + p[1] * T.s[1] + p[2] * T.s[2] + T.s[3], p[0] * T.t[0] + p[1] * T.t[1] + p[2] * T.t[2] + T.t[3]];
    });
    faces.push({ pts, st, tex: T.tex, lightofs: style0 === 255 ? -1 : lightofs, bs, lw, lh, model, ent, T, fullbright: !!(T.flags & 1) });
  }

  // let the caller throw faces away before they are grouped
  if (opts.drop) for (let i = faces.length - 1; i >= 0; i--) if (opts.drop(faces[i], textures[faces[i].tex].name)) faces.splice(i, 1);

  // let the caller repaint faces before they are grouped (same brushwork, different skin)
  if (opts.retex) faces.forEach(F => {
    const to = opts.retex(F, textures[F.tex].name);
    if (!to) return;
    const i = textures.findIndex(t => t.name === to);
    if (i >= 0) F.tex = i;
  });

  // pack lightmaps into one atlas (1 texel padding so bilinear never bleeds)
  const ATL = opts.atlas || 2048, atlas = new Uint8ClampedArray(ATL * ATL * 4);
  let ax = 0, ay = 0, rowH = 0;
  faces.slice().sort((a, b) => b.lh - a.lh).forEach(F => {
    const w = F.lw + 2, h = F.lh + 2;
    if (ax + w > ATL) { ax = 0; ay += rowH; rowH = 0; }
    if (ay + h > ATL) throw new Error('lightmap atlas full');
    F.ax = ax + 1; F.ay = ay + 1; ax += w; rowH = Math.max(rowH, h);
    for (let y = -1; y <= F.lh; y++) for (let x = -1; x <= F.lw; x++) {
      const sx = Math.min(F.lw - 1, Math.max(0, x)), sy = Math.min(F.lh - 1, Math.max(0, y));
      const d = ((F.ay + y) * ATL + F.ax + x) * 4;
      if (F.lightofs < 0 || F.fullbright) { atlas[d] = atlas[d + 1] = atlas[d + 2] = F.fullbright ? 255 : 0; }
      else { const s = LIGHT.o + F.lightofs + (sy * F.lw + sx) * 3; atlas[d] = u8[s]; atlas[d + 1] = u8[s + 1]; atlas[d + 2] = u8[s + 2]; }
      atlas[d + 3] = 255;
    }
  });
  const lmTex = new THREE.DataTexture(atlas, ATL, ATL, THREE.RGBAFormat);
  lmTex.magFilter = THREE.LinearFilter; lmTex.minFilter = THREE.LinearFilter; lmTex.flipY = false; lmTex.needsUpdate = true;

  // one geometry per (texture, render group)
  const groups = new Map();
  faces.forEach(F => {
    const e = F.ent, mode = e ? +(e.rendermode || 0) : 0;
    const key = F.tex + '|' + mode + '|' + (e ? e.renderamt || '' : '');
    if (!groups.has(key)) groups.set(key, { tex: F.tex, mode, amt: e ? +(e.renderamt || 255) : 255, pos: [], uv: [], uv2: [] });
    const G = groups.get(key), tx = textures[F.tex];
    const origin = e && e.origin ? e.origin.split(' ').map(Number) : [0, 0, 0];
    const push = i => {
      const p = F.pts[i], [s, t] = F.st[i], off = F.uvOff || [0, 0];
      G.pos.push(...gsToThree(p[0] + origin[0], p[1] + origin[1], p[2] + origin[2]));
      G.uv.push((s + off[0]) / tx.w, (t + off[1]) / tx.h);
      G.uv2.push((F.ax + (s / 16 - F.bs[0]) + .5) / ATL, (F.ay + (t / 16 - F.bs[1]) + .5) / ATL);
    };
    for (let i = 1; i + 1 < F.pts.length; i++) { push(0); push(i); push(i + 1); }
  });

  const root = new THREE.Group();
  const shared = { uLM: { value: lmTex }, uLMScale: { value: opts.lmScale || 1.0 }, uGamma: { value: opts.gamma || 1.0 }, uOver: { value: opts.over || 2.0 } };
  groups.forEach(G => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(G.pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(G.uv, 2));
    g.setAttribute('uv2', new THREE.Float32BufferAttribute(G.uv2, 2));
    g.computeVertexNormals();
    const tx = textures[G.tex], cutout = tx.name[0] === '{' || G.mode === 4, additive = G.mode === 5, trans = G.mode === 2 || additive || G.tex && tx.name[0] === '!';
    const mat = new THREE.ShaderMaterial({
      uniforms: { ...shared, uMap: { value: tx.map }, uHasMap: { value: tx.map ? 1 : 0 }, uAlpha: { value: trans ? G.amt / 255 : 1 }, uCut: { value: cutout ? 1 : 0 }, uLMFloor: { value: 0 }, uTint: { value: new THREE.Color(1, 1, 1) } },
      vertexShader: 'attribute vec2 uv2; varying vec2 vUv; varying vec2 vUv2; void main() { vUv = uv; vUv2 = uv2; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: `uniform sampler2D uMap; uniform sampler2D uLM; uniform vec3 uTint; uniform float uHasMap, uAlpha, uCut, uLMScale, uGamma, uOver, uLMFloor; varying vec2 vUv; varying vec2 vUv2;
        void main() {
          vec4 t = uHasMap > .5 ? texture2D(uMap, vUv) : vec4(.5, .5, .5, 1.);
          if (uCut > .5 && t.a < .5) discard;
          vec3 lm = max(texture2D(uLM, vUv2).rgb * uLMScale, vec3(uLMFloor));
          vec3 c = pow(t.rgb * uTint, vec3(2.2)) * pow(lm, vec3(uGamma)) * uOver;
          gl_FragColor = vec4(pow(clamp(c, 0., 1.), vec3(1. / 2.2)), t.a * uAlpha);
        }`,
      transparent: trans, depthWrite: !trans || cutout, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(g, mat); mesh.userData.tex = tx.name; root.add(mesh);
  });

  // sample the lightmap under a point (for lighting studio models like the engine does)
  function lightAt(x, y, z) {
    let best = null, bd = 1e9;
    for (const F of faces) {
      if (F.model !== 0 || F.lightofs < 0) continue;
      const n = F.pts.length; let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9, zz = 0;
      for (const p of F.pts) { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); zz += p[2]; }
      zz /= n;
      if (x < minx || x > maxx || y < miny || y > maxy || zz > z || F.pts.some(p => Math.abs(p[2] - zz) > .5)) continue;
      if (z - zz < bd) { bd = z - zz; best = F; }

/* The board both panels hang from, spanning the whole opening: window y -44..20, curtains out to -66 and
   42, so it runs -71..47 and closes the gap that used to sit above the window. It is screwed to the wall
   (x -100) and reaches past the curtain plane (x -96) into the room, and it starts just above where the
   fabric now ends, so the cut edge of the curtain disappears behind it. Lit the way loadBSP lights the
   brushwork — the map's own lightmap off the wallpaper above the window, through the same exposure —
   so it sits in the room's light instead of glowing on top of it. */
(() => {
  const X0 = -99.6, X1 = -95.2, Y0 = -71, Y1 = 47, Z0 = SHTORA_TOP - .3, Z1 = SHTORA_TOP + 4.3;
  // the wallpaper's lightmap above the window, sampled every 24 units: dim at the far end of the wall,
  // warmer towards the middle of the room where the ceiling lamp hangs
  const LM = [[-72, 111, 89, 69], [-48, 125, 103, 81], [-24, 147, 123, 100], [0, 167, 139, 113], [24, 184, 154, 123], [48, 192, 160, 127]];
  const wallLight = y => {
    let i = 0; while (i < LM.length - 2 && y > LM[i + 1][0]) i++;
    const a = LM[i], b = LM[i + 1], k = Math.max(0, Math.min(1, (y - a[0]) / (b[0] - a[0])));
    return [1, 2, 3].map(j => (a[j] + (b[j] - a[j]) * k) / 255);
  };
  /* loadBSP's fragment shader, in JS: albedo × lightmap in linear space with the same over-exposure.
     MeshBasicMaterial multiplies vertex colours in linear space too, and the renderer encodes on the way
     out, so feeding it linear here lands on the same pixel the surrounding walls land on. */
  const shade = (rgb, y, mul) => wallLight(y).map((l, j) => Math.min(1, Math.pow(rgb[j] / 255, 2.2) * Math.pow(l, 1.4) * 1.45 * mul));
  // the pelmet's own colours, read off the strip of texture that was just cropped away
  const skin = (nx, nz) => nz > .5 ? [[232, 224, 196], 1.06] : nz < -.5 ? [[150, 140, 112], .6]
    : nx > .5 ? [[222, 212, 177], 1] : nx < -.5 ? [[120, 112, 92], .7] : [[205, 195, 162], .82];
  const geo = new THREE.BoxGeometry(X1 - X0, Y1 - Y0, Z1 - Z0);
  geo.translate((X0 + X1) / 2, (Y0 + Y1) / 2, (Z0 + Z1) / 2);
  const pos = geo.attributes.position, nrm = geo.attributes.normal, col = [];
  for (let i = 0; i < pos.count; i++) {
    const [rgb, mul] = skin(nrm.getX(i), nrm.getZ(i));
    col.push(...shade(rgb, pos.getY(i), mul));
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const [, g] = gsGroup();
  g.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true })));
})();

/* ---------------- spray: DverkaSK on the wall over the computer ----------------
   Made the way a stock Half-Life / CS 1.6 player logo is: a greyscale spray where white is paint, black is
   bare wall and grey is thin paint, tinted with a single cl_logocolor (#Valve_Blue here). The letters are
   painted like the stock v_1 logo — a solid core with grainy airbrushed edges and a speckled overspray halo —
   then brought down to spray resolution. It has no light of its own: the wall's baked light falls on it. */
(() => {
  const DIR = 1, WALL = -99.85 * DIR, CY = 72.0, CZ = 86.0, WIDTH = 34.0, TW = 160, TH = 80;
  const LOGO = [0, 60, 255];   // #Valve_Blue
  const HEIGHT = WIDTH * TH / TW;
  const tex = canvasTexture(TW, TH, () => {});
  tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const paint = () => {
    seed = 7;
    const BW = TW * 4, BH = TH * 4, big = document.createElement('canvas'); big.width = BW; big.height = BH;
    const b = big.getContext('2d'), fam = document.fonts && document.fonts.check('80px "Permanent Marker"') ? '"Permanent Marker"' : 'Impact, sans-serif';
    const txt = 'DverkaSK';
    b.fillStyle = '#000'; b.fillRect(0, 0, BW, BH);
    b.translate(BW / 2, BH / 2 + 4); b.rotate(-.2);   // sprayed on at a slant
    b.font = `100px ${fam}`;
    const size = Math.min(150, 100 * BW * .74 / b.measureText(txt).width);
    b.font = `${size}px ${fam}`; b.textAlign = 'center'; b.textBaseline = 'middle';
    b.fillStyle = '#fff'; b.fillText(txt, 0, 0);
    b.lineWidth = 4; b.lineJoin = 'round'; b.strokeStyle = '#fff'; b.strokeText(txt, 0, 0);   // a can sprays wider than a marker
    b.setTransform(1, 0, 0, 1, 0, 0);
    // overspray: the same lettering blurred wide
    const halo = document.createElement('canvas'); halo.width = BW; halo.height = BH;
    const h = halo.getContext('2d'); h.filter = 'blur(6px)'; h.drawImage(big, 0, 0);
    const core = b.getImageData(0, 0, BW, BH).data, hd = h.getImageData(0, 0, BW, BH).data, out = b.createImageData(BW, BH), o = out.data;
    for (let i = 0; i < core.length; i += 4) {
      const c = core[i] / 255, hv = hd[i] / 255, r = rnd();
      const edge = c * (hv > .92 ? 1 : .55 + .45 * r);                          // grainy edges, solid middle
      const spray = hv * (r < hv * 1.25 ? .35 + .65 * rnd() : 0) * .8;          // speckled overspray around the strokes
      const v = Math.min(255, Math.max(edge, spray) * 255);
      o[i] = o[i + 1] = o[i + 2] = 255; o[i + 3] = v;
    }
    b.putImageData(out, 0, 0);
    const { g } = tex.userData;
    g.clearRect(0, 0, TW, TH); g.imageSmoothingEnabled = true; g.drawImage(big, 0, 0, TW, TH);
    tex.needsUpdate = true;
  };
  paint();
  if (document.fonts) document.fonts.load('80px "Permanent Marker"').then(paint, () => {});
  // MAP.lightAt samples the floor under a point (it lights models), so read the wall's own lightmap texel from
  // the atlas instead, and put it through loadBSP's exposure (pow 1.4, ×1.45)
  const wallLight = (x, y, z) => {
    const atl = MAP.lightmap.image, D = atl.data;
    for (const F of MAP.faces) {
      if (F.lightofs < 0 || !F.pts.every(q => Math.abs(q[0] - x) < .6)) continue;   // a face in the wall plane x = const
      const ys = F.pts.map(q => q[1]), zs = F.pts.map(q => q[2]);
      if (y < Math.min(...ys) || y > Math.max(...ys) || z < Math.min(...zs) || z > Math.max(...zs)) continue;
      const T = F.T, ss = x * T.s[0] + y * T.s[1] + z * T.s[2] + T.s[3], tt = x * T.t[0] + y * T.t[1] + z * T.t[2] + T.t[3];
      const lx = Math.min(F.lw - 1, Math.max(0, Math.round(ss / 16 - F.bs[0]))), ly = Math.min(F.lh - 1, Math.max(0, Math.round(tt / 16 - F.bs[1])));
      const i = ((F.ay + ly) * atl.width + F.ax + lx) * 4;
      return [D[i] / 255, D[i + 1] / 255, D[i + 2] / 255];
    }
    return [.6, .5, .42];
  };
  const l = wallLight(-100 * DIR, CY, CZ).map(v => Math.min(1.4, Math.pow(v, 1.4) * 1.45));
  const tint = new THREE.Color(...LOGO.map(v => v / 255)).convertSRGBToLinear();
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, color: new THREE.Color(tint.r * l[0], tint.g * l[1], tint.b * l[2]),
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  tex.encoding = THREE.sRGBEncoding;
  const geo = new THREE.PlaneGeometry(WIDTH, HEIGHT); geo.rotateY(Math.PI / 2); geo.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(geo, mat); m.rotation.z = DIR < 0 ? Math.PI : 0; m.position.set(WALL, CY, CZ);
  const [, grp] = gsGroup(); grp.add(m);
})();

const GUESTS = [];

function sitPose(G, t, arms) {
  const c = G.c;
  c.pose('idle1', 0);
  ['Spine', 'Spine1', 'Spine2', 'Spine3'].forEach((b, i, a) => c.aim('Bip01 ' + b, 'Bip01 ' + (a[i + 1] || 'Neck'), V(.12, 0, 1)));
  c.aim('Bip01 Neck', 'Bip01 Head', V(.05, 0, 1));
  [['L', 1], ['R', -1]].forEach(([s, sy]) => {
    c.aim(`Bip01 ${s} Thigh`, `Bip01 ${s} Calf`, V(1, .1 * sy, .02));
    c.aim(`Bip01 ${s} Calf`, `Bip01 ${s} Foot`, V(.12, .02 * sy, -1));
    c.aim(`Bip01 ${s} Foot`, `Bip01 ${s} Toe0`, V(1, 0, -.15));
    c.aim(`Bip01 ${s} UpperArm`, `Bip01 ${s} Forearm`, arms[s].upper);
    c.aim(`Bip01 ${s} Forearm`, `Bip01 ${s} Hand`, arms[s].fore);
  });
  c.turn('Bip01 Head', V(0, 0, 1), G.look || 0);
}

function spawnGuest(def) {
  const [m, t] = ASSETS[def.model];
  const c = buildCharacter(parseMDL(b64bytes(m), t ? b64bytes(t) : null));
  c.root.rotation.y = def.yaw * Math.PI / 180;
  c.setLight(litColor(def.x, def.y, def.seat + 30));
  scene.add(c.root);
  const G = Object.assign({ c, act: 0, actT: 1 + Math.random() * 3, talkT: 3 + Math.random() * 6, bubbleT: 0, look: 0, lookT: 0, lookTo: 0 }, def);
  GUESTS.push(G);
  return G;
}

  DV.open += (openTo - DV.open) * Math.min(1, dt * (CT.state === 'idle' ? 7 : 14));
  DV.pivot.rotation.z = (1.15 + .55 * CT.wide) * DV.open;
}

function drawTV(t) {
  const { g } = TV.userData, W = 144, H = 96;
  px(g, 0, 0, W, H, '#050304');
  if (TV_PIC.complete && TV_PIC.naturalWidth) {
    g.imageSmoothingEnabled = true;
    const jit = reduce ? 0 : (Math.random() < .08 ? (Math.random() - .5) * 4 : 0);
    // a faint colour-fringe ghost first, then the picture over it
    g.globalAlpha = .35; g.drawImage(TV_PIC, 1.5 + jit, 0, W, H);
    g.globalAlpha = .9; g.drawImage(TV_PIC, jit, 0, W, H);
    g.globalAlpha = 1; g.imageSmoothingEnabled = false;
  }
  // snow
  for (let i = 0; i < 260; i++) { const v = Math.random() * 255 | 0; g.fillStyle = `rgba(${v},${v},${v},${(.06 + Math.random() * .12).toFixed(2)})`; g.fillRect(Math.random() * W | 0, Math.random() * H | 0, 1, 1); }
  // rolling band
  const by = reduce ? H * .4 : ((t * 18) % (H + 30)) - 15;
  const band = g.createLinearGradient(0, by - 12, 0, by + 12);
  band.addColorStop(0, 'rgba(255,255,255,0)'); band.addColorStop(.5, 'rgba(255,240,220,.1)'); band.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = band; g.fillRect(0, by - 12, W, 24);
  // scanlines
  g.fillStyle = 'rgba(0,0,0,.28)'; for (let y = 0; y < H; y += 2) g.fillRect(0, y, W, 1);
  // curved glass
  const vg = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // flicker
  g.fillStyle = `rgba(255,255,255,${reduce ? 0 : (Math.random() * .035).toFixed(3)})`; g.fillRect(0, 0, W, H);
  TV.needsUpdate = true;
}

   eye holes, a folded gusset on the sides and a closed top; the open end hangs round his neck with no bottom.

   upright in model space (+x forward, +y left, +z up) at the sitting pose. */

  const G = GUESTS.find(g => g.id === 'anon'), c = G.c, head = c.byName['Bip01 Head'];
  if (!head) return null;

  const hi = c.bones.indexOf(head);
  // model axes seen from the head bone
  const q = c.modelQuat('Bip01 Head').invert();
  const ax = [V(1, 0, 0), V(0, 1, 0), V(0, 0, 1)].map(a => new THREE.Vector3(...a).applyQuaternion(q));
  const lo = [1e9, 1e9, 1e9], hiE = [-1e9, -1e9, -1e9], p = new THREE.Vector3();

      tmpQ.setFromEuler(new THREE.Euler(S.w.x * dt, S.w.y * dt, S.w.z * dt)); bag.quaternion.multiply(tmpQ);
      if (bag.position.y <= S.restY && S.v.y < 0) {
        S.state = 'land'; S.k = 0; S.p0.copy(bag.position); S.q0.copy(bag.quaternion); S.v.y = 0;
        setLight(litColor(...threeToGs(bag.position), .3, 1.3));
      }
    } else if (S.state === 'land') {
      // a little skid and a flop onto its side
      S.k = Math.min(1, S.k + dt / .35);
      const e = 1 - Math.pow(1 - S.k, 3);
      bag.position.x = S.p0.x + S.v.x * .12 * e; bag.position.z = S.p0.z + S.v.z * .12 * e;
      bag.position.y = S.restY + Math.sin(S.k * Math.PI) * .9 * GS * (1 - S.k);
      bag.quaternion.slerpQuaternions(S.q0, S.restQ, e);
      if (S.k >= 1) S.state = 'floor';
    } else if (S.state === 'back') {
      // hop up on an arc onto the head, which may be turning meanwhile
      S.k = Math.min(1, S.k + dt / .55);
      const e = S.k * S.k * (3 - 2 * S.k);
      head.updateWorldMatrix(true, false);
      tp.copy(baseP).applyMatrix4(head.matrixWorld);
      head.matrixWorld.decompose(ts, tq, new THREE.Vector3()); tq.multiply(baseQ);
      bag.position.lerpVectors(S.p0, tp, e); bag.position.y += Math.sin(S.k * Math.PI) * 22 * GS;
      bag.quaternion.slerpQuaternions(S.q0, tq, e);
      if (S.k >= 1) {
        head.attach(bag); bag.position.copy(baseP); bag.quaternion.copy(baseQ);
        setLight(light); S.state = 'on'; S.amp = .4; S.ph = 0;
      }
    }
  }
  return { mesh: bag, poke, update, get hover() { return S.hover; }, set hover(v) { S.hover = v; } };
})();


/* ---------------- wallhack: green glow outline + ESP box on the trollface guy ---------------- */
const ESP = (() => {
  const G = GUESTS.find(g => g.id === 'troll'), c = G.c;
  /* outline: a screen-space silhouette. The troll lives on layer 1 as well as the camera's usual layer 0;
     each frame his whole silhouette is drawn white (with its depth) and the rest of the room's depth is
     drawn separately. A full-screen pass paints a solid ring of green around the silhouette, and drops the
     ring wherever something in the room is closer than he is; the ring also grows only from the parts of
     him that are really visible, so the table or the pot cover the outline the way they cover him — no
     green smudges poking out past their edges. */
  c.gs.children.forEach(m => { if (m.isSkinnedMesh) m.layers.set(1); });
  camera.layers.enable(1);
  const mkRT = () => { const r = new THREE.WebGLRenderTarget(1, 1, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter }); r.depthTexture = new THREE.DepthTexture(1, 1); return r; };
  const rt = mkRT(), roomRT = mkRT();
  const black = new THREE.MeshBasicMaterial({ color: 0x000000, skinning: true, side: THREE.DoubleSide });
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff, skinning: true, side: THREE.DoubleSide });
  const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const ring = new THREE.ShaderMaterial({
    uniforms: { uMask: { value: rt.texture }, uDepth: { value: rt.depthTexture }, uRoom: { value: roomRT.depthTexture }, uPx: { value: new THREE.Vector2() }, uR: { value: 3 },
      uNear: { value: camera.near }, uFar: { value: camera.far } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
    fragmentShader: `uniform sampler2D uMask, uDepth, uRoom; uniform vec2 uPx; uniform float uR, uNear, uFar; varying vec2 vUv;
      float lin(float d) { return uNear * uFar / (uFar - d * (uFar - uNear)); }
      void main() {
        if (texture2D(uMask, vUv).r > .5) discard;
        float nearest = 1.;
        for (int i = 0; i < 24; i++) {
          float a = float(i) * 6.2831853 / 24.;
          vec2 d = vec2(cos(a), sin(a)) * uPx;
          for (int k = 1; k <= 2; k++) {
            vec2 q = vUv + d * uR * float(k) * .5;
            float dz = texture2D(uDepth, q).r;
            // only his pixels the camera actually sees: a hand behind the pot must not ring the pot's edge
            if (texture2D(uMask, q).r > .5 && lin(dz) <= lin(texture2D(uRoom, q).r) + .05) nearest = min(nearest, dz);
          }
        }
        if (nearest >= 1.) discard;
        if (lin(texture2D(uRoom, vUv).r) < lin(nearest) - .05) discard;
        gl_FragColor = vec4(.17, 1., .24, 1.);
      }`,
    depthTest: false, depthWrite: false, transparent: true });
  quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), ring));
  const size = new THREE.Vector2();
  // things that are invisible or see-through in the room but would turn solid under the black override;
  // the wine glasses are see-through too, so they must not punch holes in his outline; the olivier pot
  // right beside him is left out the same way, so it never leaves a green smudge on its rim
  const ghosts = [DV.hit, DV.hitWide, PC.hit, PC.wash, TVH.hit, TVH.wash, ...GLASSES];

  const el = $("#esp"), v = new THREE.Vector3();
  function box() {
    // screen-space bounds of the posed body (every skinned vertex), padded like a CS ESP box
    c.root.updateMatrixWorld(true);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, behind = false;
    c.gs.children.forEach(m => {
      if (!m.isSkinnedMesh) return;
      const pos = m.geometry.attributes.position, si = m.geometry.attributes.skinIndex;
      for (let i = 0; i < pos.count; i += 4) {
        v.fromBufferAttribute(pos, i).applyMatrix4(m.skeleton.bones[si.getX(i)].matrixWorld).project(camera);
        if (v.z > 1) { behind = true; continue; }
        const sx = (v.x + 1) / 2 * innerWidth, sy = (1 - v.y) / 2 * innerHeight;
        x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
      }
    });
    if (behind || x1 < x0) { el.hidden = true; return; }
    const pad = Math.max(6, (y1 - y0) * .08);
    el.hidden = false;
    el.style.transform = `translate(${(x0 - pad).toFixed(1)}px, ${(y0 - pad).toFixed(1)}px)`;
    el.style.width = (x1 - x0 + pad * 2) + 'px'; el.style.height = (y1 - y0 + pad * 2) + 'px';
  }
  function outline() {
    renderer.getDrawingBufferSize(size); size.divideScalar(renderer.getPixelRatio()).round();
    if (rt.width !== size.x || rt.height !== size.y) { rt.setSize(size.x, size.y); roomRT.setSize(size.x, size.y); }
    ring.uniforms.uPx.value.set(1 / size.x, 1 / size.y);
    ring.uniforms.uR.value = 2.5;
    const bg = scene.background, auto = renderer.autoClear, vis = ghosts.map(o => o.visible);
    scene.background = null; ghosts.forEach(o => { o.visible = false; });
    renderer.setRenderTarget(roomRT);
    scene.overrideMaterial = black; camera.layers.set(0); renderer.render(scene, camera);
    renderer.setRenderTarget(rt);
    scene.overrideMaterial = white; camera.layers.set(1); renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.autoClear = false;
    renderer.render(quadScene, quadCam);
    scene.overrideMaterial = null; scene.background = bg; renderer.autoClear = auto;
    camera.layers.set(0); camera.layers.enable(1); ghosts.forEach((o, i) => { o.visible = vis[i]; });
  }
  return { box, outline };
})();

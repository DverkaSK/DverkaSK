<title>Sychevalnya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root {
    --bg: #0b0910;
    --paper: #f3e7c9;
    --ink: #1c1420;
    --dim: #9c8fa8;
    --warm: #ffcf7a;
    --pix: "Press Start 2P", "Courier New", monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--paper); font: 11px/1.4 var(--pix); overflow: hidden; }
  #view { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #view.hot { cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .bubble {
    position: fixed; z-index: 3; left: 0; top: 0; transform: translate(-50%, calc(-100% - 10px));
    padding: 7px 10px; background: var(--paper); color: var(--ink); font: 11px/1.3 var(--pix);
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s;
    box-shadow: 0 0 0 2px var(--ink), 4px 4px 0 2px rgba(0,0,0,.45);
  }
  .bubble::after { content: ""; position: absolute; left: calc(50% - 5px); bottom: -7px; border: 5px solid transparent; border-top: 5px solid var(--paper); border-bottom: 0; }
  .bubble.on { opacity: 1; }
  .bubble.small { font-size: 9px; padding: 5px 7px; }
  .corner { position: fixed; z-index: 2; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 10px; color: var(--dim); pointer-events: none; text-shadow: 2px 2px 0 #000; }
  .corner b { color: var(--warm); font-weight: normal; }
  .hint { position: fixed; z-index: 2; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 10px; color: var(--dim); pointer-events: none; text-shadow: 2px 2px 0 #000; white-space: nowrap; }
  .pix { position: fixed; z-index: 4; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; align-items: center; font-size: 9px; color: var(--dim); text-shadow: 2px 2px 0 #000; }
  .pix button { font: 9px/1 var(--pix); color: var(--dim); background: rgba(20,14,26,.75); border: 0; padding: 7px 8px; cursor: pointer; box-shadow: 0 0 0 2px #2a2030; }
  .pix button:hover { color: var(--paper); }
  .pix button.on { color: var(--ink); background: var(--warm); box-shadow: 0 0 0 2px var(--ink); }
  .pix button:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
</style>

<h1 class="sr">DverkaSK</h1>
<canvas id="view" aria-label="Pixel-art room of a Russian flat on New Year's Eve: anons in trollface masks and a paper bag sit on a sofa under a wall rug, a cat on the table, the DverkaSK sign on the floor and a little door mascot running around"></canvas>
<div class="corner"><b>dverka.sk</b> · концепт</div>
<div class="pix" id="rip"><span>рябь</span><button type="button" data-r="1">вкл</button><button type="button" data-r="0">выкл</button></div>
<div class="hint" id="hint">наведи на Дверку — она приоткроется</div>
<div class="bubble" id="m-bubble"></div>
<div id="c-bubbles"></div>

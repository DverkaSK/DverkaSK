<title>Dverka Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Pangolin&display=swap">
<style>
  :root {
    --night: #16172e;
    --glass: rgba(24, 24, 46, .86);
    --glass-edge: rgba(255, 214, 150, .18);
    --warm: #ffd08a;
    --amber: #ffab4a;
    --cream: #fff0d6;
    --muted: #b9b3cf;
    --ink: #2a1a12;
    --sky1: #141633; --sky2: #2c2a5a; --sky3: #6a4d7c;
    --round: "M PLUS Rounded 1c", "Nunito", "Segoe UI", system-ui, sans-serif;
    --hand: "Pangolin", "Comic Sans MS", "Segoe Print", cursive;
    color-scheme: dark;
  }
  html.s-autumn { --sky1: #1a1530; --sky2: #3d2b4f; --sky3: #8a5a5a; }
  html.s-spring { --sky1: #1b1f3d; --sky2: #3a3f72; --sky3: #8c6a96; }
  html.s-summer { --sky1: #0f1a33; --sky2: #1f3a5e; --sky3: #4f6f84; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--cream);
    font: 15px/1.5 var(--round); overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  #street { position: fixed; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  #street::-webkit-scrollbar { display: none; }
  #scene { position: relative; height: 100%; width: max(100vw, 177.78vh); }
  #svg { display: block; width: 100%; height: 100%; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  /* seasonal decor switches */
  .d-winter, .d-autumn, .d-spring, .d-summer { display: none; }
  html.s-winter .d-winter, html.s-autumn .d-autumn, html.s-spring .d-spring, html.s-summer .d-summer { display: inline; }

  .door { cursor: pointer; outline: none; }
  .door:focus-visible .frame { stroke: var(--warm); stroke-width: 5; }
  .win .glass { fill: #262846; transition: fill .6s; }
  .win.lit .glass { fill: url(#winLit); }
  .win .glow { opacity: 0; transition: opacity .6s; }
  .win.lit .glow { opacity: .9; }
  .star { animation: tw 3.5s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .25; } }
  .bulb { animation: bulb 1.6s steps(1) infinite; }
  @keyframes bulb { 50% { opacity: .35; } }
  .tail { animation: tail 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
  @keyframes tail { 50% { transform: rotate(18deg); } }
  .drip { animation: drip 2.2s ease-in infinite; }
  @keyframes drip { 0%, 40% { transform: translateY(0); opacity: 0; } 45% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
  .prop { animation: prop .22s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes prop { 50% { transform: scaleX(-1); } }
  .letter { animation: letter 3s ease-in-out infinite; }
  @keyframes letter { 50% { transform: translateY(-3px); } }

  /* brand */
  .brand { position: fixed; z-index: 5; left: 20px; top: calc(16px + env(safe-area-inset-top, 0px)); pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .brand b { display: block; font: 800 26px/1 var(--round); letter-spacing: -.01em; color: var(--cream); }
  .brand span { font-size: 13px; color: var(--muted); }

  /* bubble + popover */
  .bubble {
    position: fixed; z-index: 6; left: 0; top: 0; transform: translate(-50%, calc(-100% - 14px));
    max-width: min(260px, 70vw); padding: 8px 13px; border-radius: 16px;
    background: var(--cream); color: var(--ink); font: 17px/1.25 var(--hand);
    box-shadow: 0 6px 20px rgba(0,0,0,.35); pointer-events: none; text-align: center;
    transition: opacity .2s, transform .2s;
  }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: var(--cream); transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
  .bubble.off { opacity: 0; transform: translate(-50%, calc(-100% - 4px)) scale(.9); }

  .pop {
    position: fixed; z-index: 7; transform: translate(-50%, calc(-100% - 12px));
    width: min(270px, calc(100vw - 32px)); padding: 14px 16px 16px; border-radius: 18px;
    background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(8px);
    box-shadow: 0 16px 40px rgba(0,0,0,.45); display: grid; gap: 6px;
    animation: popin .28s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes popin { from { opacity: 0; transform: translate(-50%, calc(-100% + 6px)) scale(.92); } }
  .pop h3 { margin: 0; font: 800 20px/1.1 var(--round); color: var(--warm); }
  .pop p { margin: 0; color: var(--muted); font-size: 14px; }
  .pop .url { font-size: 12px; color: var(--muted); opacity: .8; word-break: break-all; }
  .go {
    justify-self: start; margin-top: 4px; padding: 8px 16px; border-radius: 999px; border: 0; cursor: pointer; text-decoration: none;
    background: var(--amber); color: var(--ink); font: 800 15px/1 var(--round);
    box-shadow: 0 3px 0 #b8691f; transition: transform .12s;
  }
  .go:hover { transform: translateY(-1px); }
  .go:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8691f; }
  .go:focus-visible, .chip:focus-visible, .item:focus-visible, .x:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }

  /* dock */
  .dock {
    position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
    width: max-content; max-width: calc(100vw - 32px);
    padding: 6px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(8px);
  }
  .seg { display: flex; gap: 2px; }
  .chip { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 800; font-size: 14px; }
  .chip:hover { color: var(--cream); }
  .chip.on { background: rgba(255, 208, 138, .16); color: var(--warm); }
  .chip.main { background: var(--amber); color: var(--ink); box-shadow: 0 3px 0 #b8691f; }
  .chip.main:hover { color: var(--ink); }
  .sep { width: 1px; height: 22px; background: var(--glass-edge); }

  /* wardrobe */
  .sheet {
    position: fixed; z-index: 8; left: 50%; transform: translateX(-50%);
    bottom: calc(74px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100vw - 32px));
    padding: 14px 16px 16px; border-radius: 22px; background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px rgba(0,0,0,.5); display: grid; gap: 10px;
    animation: sheetin .3s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes sheetin { from { opacity: 0; transform: translate(-50%, 16px); } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  .sheet-head h2 { margin: 0; font: 800 18px var(--round); color: var(--warm); }
  .x { border: 0; background: rgba(255,255,255,.08); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; }
  .row-label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .items { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .item {
    flex: none; width: 70px; padding: 6px 4px 5px; border-radius: 14px; border: 2px solid transparent; cursor: pointer;
    background: rgba(255,255,255,.05); display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted);
  }
  .item svg { width: 48px; height: 40px; }
  .item:hover { background: rgba(255,255,255,.1); color: var(--cream); }
  .item.on { border-color: var(--amber); color: var(--cream); background: rgba(255,171,74,.12); }

  /* rooms behind doors */
  .room {
    position: fixed; z-index: 9; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(620px, calc(100vw - 32px)); max-height: calc(100% - 48px); overflow: auto;
    border-radius: 26px; padding: 26px 26px 24px;
    background: radial-gradient(120% 90% at 20% 0%, #4a3346 0%, #2a2138 55%, #1d1a2e 100%);
    border: 6px solid #6b4128; box-shadow: 0 0 0 2px #3d2416, 0 30px 80px rgba(0,0,0,.6), inset 0 0 60px rgba(255,170,80,.12);
    animation: sheetin .35s cubic-bezier(.3,1.3,.5,1);
  }
  .room h2 { margin: 0 0 10px; font: 800 28px/1.1 var(--round); color: var(--warm); text-wrap: balance; }
  .room p { margin: 0 0 12px; max-width: 60ch; color: var(--cream); }
  .room .x { position: absolute; right: 14px; top: 14px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; padding: 0; list-style: none; }
  .facts li { padding: 8px 12px; border-radius: 14px; background: rgba(255,208,138,.1); font-size: 13px; color: var(--muted); }
  .facts b { display: block; font: 800 20px/1.1 var(--round); color: var(--cream); font-variant-numeric: tabular-nums; }
  .cozy { font: 17px/1.3 var(--hand); color: var(--muted); }
  .peg {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; padding: 16px; margin: 8px 0 18px; border-radius: 16px;
    background-color: #7a5234;
    background-image: radial-gradient(circle, rgba(0,0,0,.35) 2px, transparent 2.5px);
    background-size: 22px 22px; box-shadow: inset 0 2px 10px rgba(0,0,0,.4);
  }
  .peg figure { margin: 0; display: grid; justify-items: center; gap: 4px; font-size: 11px; color: #f5e4c8; }
  .peg img { width: 38px; height: 38px; padding: 6px; border-radius: 12px; background: rgba(22,18,30,.55); box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .peg.new { background-color: #3f3a6b; }
  .room h3 { margin: 6px 0 0; font: 800 15px var(--round); color: var(--warm); letter-spacing: .02em; }

  .hint { position: fixed; z-index: 4; right: 16px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); opacity: .7; pointer-events: none; }
  @media (max-width: 760px) {
    .hint { display: none; }
    .brand b { font-size: 21px; }
    .chip { padding: 7px 9px; font-size: 13px; }
    .dock { border-radius: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .star, .bulb, .tail, .drip, .prop, .letter { animation: none; }
    .pop, .sheet, .room { animation: none; }
  }
</style>

<div id="street"><div id="scene"><svg id="svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Evening street of living doors"></svg></div></div>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="brand"><b>dverka.sk</b><span id="t-sub"></span></header>
<div class="bubble off" id="bubble" aria-live="polite"></div>
<div class="pop" id="pop" hidden role="dialog">
  <h3 id="pop-t"></h3>
  <p id="pop-p"></p>
  <div class="url" id="pop-u"></div>
  <a class="go" id="pop-go" href="#" target="_blank" rel="noopener"></a>
</div>

<nav class="dock" aria-label="Controls">
  <div class="seg" id="seasons"></div>
  <span class="sep"></span>
  <button class="chip main" id="btn-wardrobe" type="button"></button>
  <button class="chip" id="btn-lang" type="button">EN</button>
</nav>
<div class="hint" id="t-hint"></div>

<section class="sheet" id="wardrobe" hidden aria-labelledby="w-title">
  <div class="sheet-head"><h2 id="w-title"></h2><button class="x" type="button" data-close aria-label="Close">×</button></div>
  <div id="w-rows" style="display:grid;gap:10px"></div>
</section>

<section class="room" id="room-home" hidden aria-labelledby="home-t">
  <button class="x" type="button" data-close aria-label="Close">×</button>
  <div id="home-body"></div>
</section>
<section class="room" id="room-shop" hidden aria-labelledby="shop-t">
  <button class="x" type="button" data-close aria-label="Close">×</button>
  <div id="shop-body"></div>
</section>

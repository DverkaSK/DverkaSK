<style>
  :root { --bg: #2a1d16; --ink: #1a1614; --paper: #fff8e8; --hand: "Neucha", "Comic Sans MS", cursive; color-scheme: light; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); overflow: hidden; font: 20px/1.3 var(--hand); color: var(--paper); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #view.hot { cursor: pointer; }
  .corner { position: fixed; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); font-size: 18px; color: var(--ink); background: var(--paper); padding: 2px 10px 4px; border: 3px solid var(--ink); border-radius: 12px 16px 10px 14px; transform: rotate(-1.5deg); pointer-events: none; }
  .hint { position: fixed; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-size: 18px; color: var(--ink); background: var(--paper); padding: 2px 10px 4px; border: 3px solid var(--ink); border-radius: 14px 10px 16px 12px; transform: rotate(1deg); pointer-events: none; }
</style>

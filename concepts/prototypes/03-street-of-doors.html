<title>Dverka Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Pangolin&display=swap">
<style>
  :root {
    --night: #16172e;
    --glass: rgba(24, 24, 46, .86);
    --glass-edge: rgba(255, 214, 150, .18);
    --warm: #ffd08a;
    --amber: #ffab4a;
    --cream: #fff0d6;
    --muted: #b9b3cf;
    --ink: #2a1a12;
    --sky1: #141633; --sky2: #2c2a5a; --sky3: #6a4d7c;
    --round: "M PLUS Rounded 1c", "Nunito", "Segoe UI", system-ui, sans-serif;
    --hand: "Pangolin", "Comic Sans MS", "Segoe Print", cursive;
    color-scheme: dark;
  }
  html.s-autumn { --sky1: #1a1530; --sky2: #3d2b4f; --sky3: #8a5a5a; }
  html.s-spring { --sky1: #1b1f3d; --sky2: #3a3f72; --sky3: #8c6a96; }
  html.s-summer { --sky1: #0f1a33; --sky2: #1f3a5e; --sky3: #4f6f84; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--cream);
    font: 15px/1.5 var(--round); overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  #street { position: fixed; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  #street::-webkit-scrollbar { display: none; }
  #scene { position: relative; height: 100%; width: max(100vw, 177.78vh); }
  #svg { display: block; width: 100%; height: 100%; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  /* seasonal decor switches */
  .d-winter, .d-autumn, .d-spring, .d-summer { display: none; }
  html.s-winter .d-winter, html.s-autumn .d-autumn, html.s-spring .d-spring, html.s-summer .d-summer { display: inline; }

  .door { cursor: pointer; outline: none; }
  .door:focus-visible .frame { stroke: var(--warm); stroke-width: 5; }
  .win .glass { fill: #262846; transition: fill .6s; }
  .win.lit .glass { fill: url(#winLit); }
  .win .glow { opacity: 0; transition: opacity .6s; }
  .win.lit .glow { opacity: .9; }
  .star { animation: tw 3.5s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .25; } }
  .bulb { animation: bulb 1.6s steps(1) infinite; }
  @keyframes bulb { 50% { opacity: .35; } }
  .tail { animation: tail 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
  @keyframes tail { 50% { transform: rotate(18deg); } }
  .drip { animation: drip 2.2s ease-in infinite; }
  @keyframes drip { 0%, 40% { transform: translateY(0); opacity: 0; } 45% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
  .prop { animation: prop .22s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes prop { 50% { transform: scaleX(-1); } }
  .letter { animation: letter 3s ease-in-out infinite; }
  @keyframes letter { 50% { transform: translateY(-3px); } }

  /* brand */
  .brand { position: fixed; z-index: 5; left: 20px; top: calc(16px + env(safe-area-inset-top, 0px)); pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .brand b { display: block; font: 800 26px/1 var(--round); letter-spacing: -.01em; color: var(--cream); }
  .brand span { font-size: 13px; color: var(--muted); }

  /* bubble + popover */
  .bubble {
    position: fixed; z-index: 6; left: 0; top: 0; transform: translate(-50%, calc(-100% - 14px));
    max-width: min(260px, 70vw); padding: 8px 13px; border-radius: 16px;
    background: var(--cream); color: var(--ink); font: 17px/1.25 var(--hand);
    box-shadow: 0 6px 20px rgba(0,0,0,.35); pointer-events: none; text-align: center;
    transition: opacity .2s, transform .2s;
  }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: var(--cream); transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
  .bubble.off { opacity: 0; transform: translate(-50%, calc(-100% - 4px)) scale(.9); }

  .pop {
    position: fixed; z-index: 7; transform: translate(-50%, calc(-100% - 12px));
    width: min(270px, calc(100vw - 32px)); padding: 14px 16px 16px; border-radius: 18px;
    background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(8px);
    box-shadow: 0 16px 40px rgba(0,0,0,.45); display: grid; gap: 6px;
    animation: popin .28s cubic-bezier(.3,1.5,.5,1);
  }
  @keyframes popin { from { opacity: 0; transform: translate(-50%, calc(-100% + 6px)) scale(.92); } }
  .pop h3 { margin: 0; font: 800 20px/1.1 var(--round); color: var(--warm); }
  .pop p { margin: 0; color: var(--muted); font-size: 14px; }
  .pop .url { font-size: 12px; color: var(--muted); opacity: .8; word-break: break-all; }
  .go {
    justify-self: start; margin-top: 4px; padding: 8px 16px; border-radius: 999px; border: 0; cursor: pointer; text-decoration: none;
    background: var(--amber); color: var(--ink); font: 800 15px/1 var(--round);
    box-shadow: 0 3px 0 #b8691f; transition: transform .12s;
  }
  .go:hover { transform: translateY(-1px); }
  .go:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8691f; }
  .go:focus-visible, .chip:focus-visible, .item:focus-visible, .x:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }

  /* dock */
  .dock {
    position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
    width: max-content; max-width: calc(100vw - 32px);
    padding: 6px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(8px);
  }
  .seg { display: flex; gap: 2px; }
  .chip { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 800; font-size: 14px; }
  .chip:hover { color: var(--cream); }
  .chip.on { background: rgba(255, 208, 138, .16); color: var(--warm); }
  .chip.main { background: var(--amber); color: var(--ink); box-shadow: 0 3px 0 #b8691f; }
  .chip.main:hover { color: var(--ink); }
  .sep { width: 1px; height: 22px; background: var(--glass-edge); }

  /* wardrobe */
  .sheet {
    position: fixed; z-index: 8; left: 50%; transform: translateX(-50%);
    bottom: calc(74px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100vw - 32px));
    padding: 14px 16px 16px; border-radius: 22px; background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px rgba(0,0,0,.5); display: grid; gap: 10px;
    animation: sheetin .3s cubic-bezier(.3,1.4,.5,1);
  }
  @keyframes sheetin { from { opacity: 0; transform: translate(-50%, 16px); } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  .sheet-head h2 { margin: 0; font: 800 18px var(--round); color: var(--warm); }
  .x { border: 0; background: rgba(255,255,255,.08); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; }
  .row-label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .items { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .item {
    flex: none; width: 70px; padding: 6px 4px 5px; border-radius: 14px; border: 2px solid transparent; cursor: pointer;
    background: rgba(255,255,255,.05); display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted);
  }
  .item svg { width: 48px; height: 40px; }
  .item:hover { background: rgba(255,255,255,.1); color: var(--cream); }
  .item.on { border-color: var(--amber); color: var(--cream); background: rgba(255,171,74,.12); }

  /* rooms behind doors */
  .room {
    position: fixed; z-index: 9; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(620px, calc(100vw - 32px)); max-height: calc(100% - 48px); overflow: auto;
    border-radius: 26px; padding: 26px 26px 24px;
    background: radial-gradient(120% 90% at 20% 0%, #4a3346 0%, #2a2138 55%, #1d1a2e 100%);
    border: 6px solid #6b4128; box-shadow: 0 0 0 2px #3d2416, 0 30px 80px rgba(0,0,0,.6), inset 0 0 60px rgba(255,170,80,.12);
    animation: sheetin .35s cubic-bezier(.3,1.3,.5,1);
  }
  .room h2 { margin: 0 0 10px; font: 800 28px/1.1 var(--round); color: var(--warm); text-wrap: balance; }
  .room p { margin: 0 0 12px; max-width: 60ch; color: var(--cream); }
  .room .x { position: absolute; right: 14px; top: 14px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; padding: 0; list-style: none; }
  .facts li { padding: 8px 12px; border-radius: 14px; background: rgba(255,208,138,.1); font-size: 13px; color: var(--muted); }
  .facts b { display: block; font: 800 20px/1.1 var(--round); color: var(--cream); font-variant-numeric: tabular-nums; }
  .cozy { font: 17px/1.3 var(--hand); color: var(--muted); }
  .peg {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; padding: 16px; margin: 8px 0 18px; border-radius: 16px;
    background-color: #7a5234;
    background-image: radial-gradient(circle, rgba(0,0,0,.35) 2px, transparent 2.5px);
    background-size: 22px 22px; box-shadow: inset 0 2px 10px rgba(0,0,0,.4);
  }
  .peg figure { margin: 0; display: grid; justify-items: center; gap: 4px; font-size: 11px; color: #f5e4c8; }
  .peg img { width: 38px; height: 38px; padding: 6px; border-radius: 12px; background: rgba(22,18,30,.55); box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .peg.new { background-color: #3f3a6b; }
  .room h3 { margin: 6px 0 0; font: 800 15px var(--round); color: var(--warm); letter-spacing: .02em; }

  .hint { position: fixed; z-index: 4; right: 16px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); opacity: .7; pointer-events: none; }
  @media (max-width: 760px) {
    .hint { display: none; }
    .brand b { font-size: 21px; }
    .chip { padding: 7px 9px; font-size: 13px; }
    .dock { border-radius: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .star, .bulb, .tail, .drip, .prop, .letter { animation: none; }
    .pop, .sheet, .room { animation: none; }
  }
</style>

<div id="street"><div id="scene"><svg id="svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Evening street of living doors"></svg></div></div>
<canvas id="fx" aria-hidden="true"></canvas>

<header class="brand"><b>dverka.sk</b><span id="t-sub"></span></header>
<div class="bubble off" id="bubble" aria-live="polite"></div>
<div class="pop" id="pop" hidden role="dialog">
  <h3 id="pop-t"></h3>
  <p id="pop-p"></p>
  <div class="url" id="pop-u"></div>
  <a class="go" id="pop-go" href="#" target="_blank" rel="noopener"></a>
</div>

<nav class="dock" aria-label="Controls">
  <div class="seg" id="seasons"></div>
  <span class="sep"></span>
  <button class="chip main" id="btn-wardrobe" type="button"></button>
  <button class="chip" id="btn-lang" type="button">EN</button>
</nav>
<div class="hint" id="t-hint"></div>

<section class="sheet" id="wardrobe" hidden aria-labelledby="w-title">
  <div class="sheet-head"><h2 id="w-title"></h2><button class="x" type="button" data-close aria-label="Close">×</button></div>
  <div id="w-rows" style="display:grid;gap:10px"></div>
</section>

<section class="room" id="room-home" hidden aria-labelledby="home-t">
  <button class="x" type="button" data-close aria-label="Close">×</button>
  <div id="home-body"></div>
</section>
<section class="room" id="room-shop" hidden aria-labelledby="shop-t">
  <button class="x" type="button" data-close aria-label="Close">×</button>
  <div id="shop-body"></div>
</section>

function sky() {
  let s = `<rect width="1600" height="900" fill="url(#sky)"/>`;
  s += `<g class="d-winter d-summer d-spring d-autumn">`;
  for (let i = 0; i < 80; i++) s += `<circle class="star" cx="${(r() * 1600).toFixed(0)}" cy="${(r() * 380).toFixed(0)}" r="${(.6 + r() * 1.2).toFixed(1)}" fill="#fff6e0" style="animation-delay:${(r() * 3.5).toFixed(2)}s"/>`;
  s += `</g>`;
  s += `<circle cx="1290" cy="118" r="95" fill="url(#moonGlow)"/><circle cx="1290" cy="118" r="30" fill="#fff3d6"/><circle cx="1280" cy="110" r="6" fill="#efe0bf"/><circle cx="1300" cy="128" r="4" fill="#efe0bf"/>`;
  // Bratislava-style castle on the hill: a box with four corner towers
  s += `<path d="M760 480 Q930 330 1110 336 Q1300 342 1500 480 Z" fill="#2a2850"/>`;
  s += `<g fill="#302d5c"><rect x="1030" y="262" width="150" height="82"/>
    <rect x="1022" y="236" width="24" height="108"/><rect x="1164" y="236" width="24" height="108"/>
    <path d="M1020 238 L1034 218 L1048 238 Z M1162 238 L1176 218 L1190 238 Z"/></g>`;
  s += `<g fill="#ffcf7a" opacity=".75"><rect x="1060" y="286" width="5" height="7"/><rect x="1098" y="286" width="5" height="7"/><rect x="1136" y="300" width="5" height="7"/><rect x="1031" y="262" width="4" height="6"/></g>`;
  // far rooftops
  let d = 'M0 900 L0 400', x = 0;
  while (x < 1600) { const w = 50 + r() * 70, h = 330 + r() * 80; d += ` L${x} ${h} L${x + w / 2} ${h - 30 - r() * 30} L${x + w} ${h}`; x += w; }
  s += `<path d="${d} L1600 900 Z" fill="#23234a"/>`;
  for (let i = 0; i < 26; i++) s += `<rect x="${(r() * 1600).toFixed(0)}" y="${(380 + r() * 60).toFixed(0)}" width="4" height="6" fill="#ffc46a" opacity="${(.3 + r() * .5).toFixed(2)}"/>`;
  return s;
}

function roof(H, y0) {
  const { x, w } = H, rc = '#2e2940', re = '#463d5c';
  let s = '', snow = '';
  if (H.roof === 'gable') {
    const rh = w * .36;
    s += `<path d="M${x - 8} ${y0} L${x + w / 2} ${y0 - rh} L${x + w + 8} ${y0} Z" fill="${rc}"/>`;
    s += `<path d="M${x - 8} ${y0} L${x + w / 2} ${y0 - rh} L${x + w + 8} ${y0}" fill="none" stroke="${re}" stroke-width="4"/>`;
    snow = `<path d="M${x - 8} ${y0 - 2} L${x + w / 2} ${y0 - rh - 3} L${x + w + 8} ${y0 - 2}" fill="none" stroke="#eef2ff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (H.chimney) { const cx = x + w * .72, cy = y0 - rh * .56; s = `<rect x="${cx - 9}" y="${cy - 34}" width="18" height="40" fill="#5a4150"/><rect x="${cx - 12}" y="${cy - 38}" width="24" height="6" fill="#3b2c3a"/>` + s; CHIMNEYS.push([cx, cy - 40]); snow += `<rect x="${cx - 12}" y="${cy - 42}" width="24" height="6" rx="3" fill="#eef2ff"/>`; }
    s += `<circle cx="${x + w / 2}" cy="${y0 - rh * .45}" r="11" fill="#1c1a30"/><circle cx="${x + w / 2}" cy="${y0 - rh * .45}" r="8" fill="url(#winLit)" opacity=".9"/>`;
  } else if (H.roof === 'step') {
    const st = 5, sw = w / (st * 2 - 1), sh = 18;
    let d = `M${x} ${y0}`;
    for (let i = 0; i < st; i++) d += ` V${y0 - sh * (i + 1)} H${x + sw * (i + 1)}`;
    for (let i = st - 1; i >= 0; i--) d += ` V${y0 - sh * i}${i ? ` H${x + w - sw * i}` : ''}`;
    d += ` H${x + w} Z`;
    s += `<path d="${d}" fill="${H.col}"/><path d="${d}" fill="url(#shade)"/>`;
    for (let i = 0; i < st; i++) { snow += `<rect x="${x + sw * i - 2}" y="${y0 - sh * (i + 1) - 4}" width="${sw + 4}" height="6" rx="3" fill="#eef2ff"/><rect x="${x + w - sw * (i + 1) - 2}" y="${y0 - sh * (i + 1) - 4}" width="${sw + 4}" height="6" rx="3" fill="#eef2ff"/>`; }
    if (H.chimney) { const cx = x + w * .2; s = `<rect x="${cx - 8}" y="${y0 - 70}" width="16" height="40" fill="#4f3b4a"/>` + s; CHIMNEYS.push([cx, y0 - 72]); }
  } else {
    const rh = 56;
    s += `<path d="M${x - 6} ${y0} L${x + 18} ${y0 - rh} L${x + w - 18} ${y0 - rh} L${x + w + 6} ${y0} Z" fill="${rc}"/>`;
    s += `<rect x="${x + w / 2 - 17}" y="${y0 - rh + 12}" width="34" height="36" fill="#3b3350"/><rect x="${x + w / 2 - 11}" y="${y0 - rh + 20}" width="22" height="26" rx="11" fill="url(#winLit)"/>`;
    snow = `<path d="M${x + 16} ${y0 - rh - 2} H${x + w - 16}" stroke="#eef2ff" stroke-width="8" stroke-linecap="round"/><path d="M${x + w / 2 - 19} ${y0 - rh + 12} H${x + w / 2 + 19}" stroke="#eef2ff" stroke-width="6" stroke-linecap="round"/>`;
  }
  return s + `<g class="d-winter">${snow}</g>`;
}

function windowSVG(x, y, w, h, lit, arch, extra = '') {
  const sh = arch ? `M${x} ${y + h} V${y + w / 2} A${w / 2} ${w / 2} 0 0 1 ${x + w} ${y + w / 2} V${y + h} Z` : `M${x} ${y} H${x + w} V${y + h} H${x} Z`;
  return `<g class="win${lit ? ' lit' : ''}">
    <rect class="glow" x="${x - 26}" y="${y - 22}" width="${w + 52}" height="${h + 44}" fill="url(#winGlow)"/>
    <path class="glass" d="${sh}"/>
    ${extra}
    <path d="${sh} M${x + w / 2} ${y + (arch ? 2 : 0)} V${y + h} M${x} ${y + h * .45} H${x + w}" fill="none" stroke="#e8dcc6" stroke-opacity=".85" stroke-width="3"/>
    <rect x="${x - 5}" y="${y + h}" width="${w + 10}" height="6" rx="2" fill="#d9ccb4" opacity=".85"/>
    <rect class="d-winter" x="${x - 6}" y="${y + h - 3}" width="${w + 12}" height="6" rx="3" fill="#eef2ff"/>
    <g class="d-spring"><rect x="${x - 3}" y="${y + h + 5}" width="${w + 6}" height="9" rx="2" fill="#7a4a30"/>

}

    ${[0, 1, 2, 3, 4].map(i => { const a = i * 1.25 + .4; return `<circle cx="${cx + Math.cos(a) * dw * .15}" cy="${top + dh * .73 + Math.sin(a) * dw * .15}" r="2.2" fill="#e04848"/>`; }).join('')}

    <rect x="${cx - signW / 2}" y="${sy}" width="${signW}" height="27" rx="9" fill="${st.round ? '#3b2432' : '#27223a'}" stroke="${st.round ? '#f2c14e' : '#cfa46a'}" stroke-width="2"/>

    <text id="signt-${H.id}" x="${cx + (st.round ? 0 : 9)}" y="${sy + 19}" text-anchor="middle" font-family="M PLUS Rounded 1c, Nunito, sans-serif" font-weight="800" font-size="15" fill="${st.round ? '#ffd08a' : '#f5e4c8'}">${label}</text>
    <rect class="d-winter" x="${cx - signW / 2 + 4}" y="${sy - 3}" width="${signW - 8}" height="6" rx="3" fill="#eef2ff"/>

  const outer = `

function signIcon(id, x, y) {

    case 'gh': return `<circle cx="${x}" cy="${y}" r="9" fill="#f4f1ea"/><g fill="#181717"><ellipse cx="${x}" cy="${y - 1}" rx="5" ry="4"/><path d="M${x - 5} ${y - 2} l1 -5 l3 3 Z M${x + 5} ${y - 2} l-1 -5 l-3 3 Z"/><rect x="${x - 2}" y="${y + 2}" width="4" height="6"/></g>`;

    case 'modrinth': return `<image href="${MODRINTH}" x="${x - 9}" y="${y - 9}" width="18" height="18"/>`;
    case 'waka': return `<circle cx="${x}" cy="${y}" r="9" fill="#111"/><circle cx="${x}" cy="${y}" r="6.5" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M${x - 4} ${y - 1} l2 3.5 l2 -3 l2 3.5 l2.5 -5" fill="none" stroke="#fff" stroke-width="1.4"/>`;

function houseSVG(H) {
  const { x, w, h, col } = H, y0 = GROUND - h;
  let s = roof(H, y0);
  s += `<rect x="${x}" y="${y0}" width="${w}" height="${h}" fill="${col}"/>`;
  s += `<rect x="${x}" y="${y0}" width="${w}" height="${h}" fill="url(#shade)"/>`;
  s += `<rect x="${x}" y="${y0}" width="3" height="${h}" fill="#fff" opacity=".07"/><rect x="${x + w - 4}" y="${y0}" width="4" height="${h}" fill="#000" opacity=".15"/>`;
  s += `<rect x="${x - 4}" y="${y0 - 2}" width="${w + 8}" height="9" fill="#3a3350"/>`;
  const dh = H.door.h, bandY = GROUND - dh - 70;
  s += `<rect x="${x}" y="${bandY}" width="${w}" height="5" fill="#000" opacity=".12"/>`;
  // upper windows
  const top = y0 + 34, bottom = bandY - 14, rows = Math.max(1, Math.floor((bottom - top) / 96));
  const cols = w >= 240 ? 3 : 2, ww = 36, wh = 56, arch = H.roof === 'step' || H.id === 'home';
  for (let rI = 0; rI < rows; rI++) for (let c = 0; c < cols; c++) {
    const wx = x + (c + .5) * w / cols - ww / 2, wy = top + rI * 96 + 8;
    if (H.clock && rI === 0) { if (c === 0) s += clockSVG(x + w / 2, wy + 26); continue; }
    let extra = '';
    if (H.cat && rI === rows - 1 && c === 1) extra = `<g fill="#1a1626"><ellipse cx="${wx + 18}" cy="${wy + wh - 8}" rx="11" ry="8"/><circle cx="${wx + 12}" cy="${wy + wh - 18}" r="7"/><path d="M${wx + 6} ${wy + wh - 22} l2 -8 l4 5 Z M${wx + 13} ${wy + wh - 24} l4 -7 l2 7 Z"/><path class="tail" d="M${wx + 28} ${wy + wh - 5} q8 -2 6 -14" fill="none" stroke="#1a1626" stroke-width="3" stroke-linecap="round"/></g><circle cx="${wx + 10}" cy="${wy + wh - 19}" r="1.2" fill="#ffe27a"/><circle cx="${wx + 15}" cy="${wy + wh - 19}" r="1.2" fill="#ffe27a"/>`;
    const lit = H.cat && rI === rows - 1 && c === 1 ? true : r() < .6;
    s += windowSVG(wx, wy, ww, wh, lit, arch, extra);
    if (H.id === 'gh' && rI === rows - 1 && c === 0) { // contribution-graph flower box
      s += `<rect x="${wx - 6}" y="${wy + wh + 6}" width="${ww + 12}" height="12" rx="2" fill="#4a3526"/>`;
      for (let i = 0; i < 7; i++) for (let j = 0; j < 2; j++) s += `<rect x="${wx - 4 + i * 6.6}" y="${wy + wh + 7.5 + j * 5}" width="5" height="4" rx="1" fill="${['#0e4429', '#006d32', '#26a641', '#39d353'][Math.floor(r() * 4)]}"/>`;
    }
  }
  if (H.shopWin) {
    const sx = x + w / 2 + (H.door.off || 0) + H.door.w / 2 + 20, sw = x + w - 14 - sx, sy = GROUND - 112;
    s += `<rect x="${sx - 5}" y="${sy - 5}" width="${sw + 10}" height="102" rx="4" fill="#3b2a24"/>`;
    s += `<g class="win lit"><rect class="glow" x="${sx - 30}" y="${sy - 30}" width="${sw + 60}" height="150" fill="url(#winGlow)"/><rect class="glass" x="${sx}" y="${sy}" width="${sw}" height="92" rx="2"/></g>`;
    ['java', 'kotlin', 'kafka', 'docker', 'kubernetes', 'postgresql'].forEach((k, i) => {
      const ix = sx + 8 + (i % 3) * ((sw - 16) / 3), iy = sy + 10 + Math.floor(i / 3) * 40;
      s += `<rect x="${ix}" y="${iy + 26}" width="${(sw - 16) / 3 - 4}" height="3" fill="#6b4a30"/><image href="${ICONS[k]}" x="${ix + ((sw - 16) / 3 - 26) / 2}" y="${iy}" width="24" height="24"/>`;
    });
    s += `<rect x="${sx - 8}" y="${sy + 92}" width="${sw + 16}" height="7" rx="2" fill="#d9ccb4"/><rect class="d-winter" x="${sx - 9}" y="${sy + 89}" width="${sw + 18}" height="6" rx="3" fill="#eef2ff"/>`;
    s += `<path d="M${sx - 6} ${sy - 8} h${sw + 12} l-8 -16 h-${sw - 4} Z" fill="#c24a3a"/><path d="M${sx - 6} ${sy - 8} h${sw + 12}" stroke="#f5e4c8" stroke-width="3" stroke-dasharray="10 10"/>`;
  }
  s += doorSVG(H);
  return `<g class="house" id="house-${H.id}">${s}</g>`;
}

function clockSVG(cx, cy) {
  let t = '';
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; t += `<rect x="${cx - 1}" y="${cy - 22}" width="2" height="${i % 3 ? 3 : 5}" fill="#3a3350" transform="rotate(${i * 30} ${cx} ${cy})"/>`; }
  return `<circle cx="${cx}" cy="${cy}" r="30" fill="#3a3350"/><circle cx="${cx}" cy="${cy}" r="26" fill="#f3e6c8"/>${t}
    <rect id="clock-h" x="${cx - 2}" y="${cy - 13}" width="4" height="14" rx="2" fill="#2a2238"/>
    <rect id="clock-m" x="${cx - 1.2}" y="${cy - 20}" width="2.4" height="21" rx="1.2" fill="#2a2238"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="#d23b3b"/><rect class="d-winter" x="${cx - 22}" y="${cy - 34}" width="44" height="7" rx="3.5" fill="#eef2ff"/>`;
}

function street() {
  let s = `<rect x="0" y="${GROUND}" width="1600" height="32" fill="#4b4663"/><rect x="0" y="${GROUND + 30}" width="1600" height="7" fill="#5f5a78"/>`;
  s += `<rect x="0" y="${GROUND + 37}" width="1600" height="${900 - GROUND - 37}" fill="url(#road)"/><rect x="0" y="${GROUND + 37}" width="1600" height="${900 - GROUND - 37}" fill="url(#cobble)"/>`;

  for (let i = 0; i < 16; i++) s += `<ellipse cx="${(r() * 1600).toFixed(0)}" cy="${GROUND + 30}" rx="${(20 + r() * 40).toFixed(0)}" ry="7" fill="#eef2ff"/>`;

  for (let i = 0; i < 60; i++) s += `<ellipse cx="${(r() * 1600).toFixed(0)}" cy="${(GROUND + 4 + r() * 150).toFixed(0)}" rx="3.5" ry="2" fill="${['#e07b2a', '#c9452f', '#e8b23a'][i % 3]}" opacity=".85"/>`;
  s += `</g><g class="d-spring">`;

  s += `</g>`;
  return s;
}
function lampPools() { return [210, 660, 940, 1390].map(x => `<ellipse cx="${x}" cy="812" rx="120" ry="30" fill="url(#poolGlow)"/>`).join(''); }

function buildScene() {
  let s = defs() + sky();
  s += `<g id="houses">${HOUSES.map(houseSVG).join('')}</g>`;
  s += `<path id="rope" d="" fill="none" stroke="#1d1a2b" stroke-width="1.6"/><g id="rope-deco"></g>`;
  s += street() + lampPools();
  s += `<g id="mascot-layer"></g>`;
  s += lamps();
  svg.innerHTML = s;
  // rope across the street for garlands / bunting
  const anchors = [0, 220, 450, 670, 950, 1170, 1400, 1600];
  let d = `M0 452`;
  for (let i = 1; i < anchors.length; i++) d += ` Q${(anchors[i - 1] + anchors[i]) / 2} ${490} ${anchors[i]} 452`;
  const rope = $('#rope'); rope.setAttribute('d', d);
  const len = rope.getTotalLength(); let deco = '<g class="d-winter">', bunt = '<g class="d-summer d-spring">', cols = ['#ff5a5a', '#ffd46a', '#6fdc8c', '#6ab8ff', '#e79bff'];
  for (let l = 12, i = 0; l < len; l += 26, i++) {
    const p = rope.getPointAtLength(l);
    deco += `<circle class="bulb" cx="${p.x.toFixed(1)}" cy="${(p.y + 5).toFixed(1)}" r="4" fill="${cols[i % 5]}" style="animation-delay:${(i % 3) * .5}s"/><circle cx="${p.x.toFixed(1)}" cy="${(p.y + 5).toFixed(1)}" r="10" fill="${cols[i % 5]}" opacity=".18"/>`;
    bunt += `<path d="M${(p.x - 8).toFixed(1)} ${p.y.toFixed(1)} L${(p.x + 8).toFixed(1)} ${p.y.toFixed(1)} L${p.x.toFixed(1)} ${(p.y + 16).toFixed(1)} Z" fill="${cols[i % 5]}" opacity=".9"/>`;
  }
  $('#rope-deco').innerHTML = deco + '</g>' + bunt + '</g>';
  // door metadata
  HOUSES.forEach(H => {
    const el = $('#door-' + H.id), D = H.door;
    const cx = H.x + H.w / 2 + (D.off || 0);
    DOORS[H.id] = {
      H, el, cx, x0: cx - D.w / 2, dw: D.w, dh: D.h, open: 0, target: 0, lid: DS[D.style].sleepy ? .5 : 0, blinkT: 1 + Math.random() * 5, blink: 0,
      eyeY: GROUND - D.h + (DS[D.style].round ? D.h * .47 : D.h * .3), ery: D.w * .125,
      leaf: el.querySelector('.leaf'), pup: el.querySelector('.pup'), lidEl: el.querySelector('.lid'), spill: el.querySelector('.spill'),
      mouthO: el.querySelector('.mouth-o'), mouth: el.querySelector('.mouth'), sign: el.querySelector('.sign'), sa: 0, sv: 0, awake: false,
    };
  });
}

function renderMascot(t) {
  const e = M.els, run = Math.min(1, Math.abs(M.vx) / 500);
  const bob = run > .1 ? Math.abs(Math.sin(M.phase)) * 4 * run : Math.sin(t * 2.4) * (M.sleeping ? .6 : 1.1);
  const lean = Math.max(-14, Math.min(14, M.vx / 900 * 14));
  const sq = M.squash, sx = 1 / Math.sqrt(sq);
  e['m-root'].setAttribute('transform', `translate(${M.x.toFixed(1)} ${(FEET - M.h).toFixed(1)}) scale(1.3)`);
  e['m-shadow'].setAttribute('transform', `translate(0 ${M.h.toFixed(1)}) scale(${Math.max(.4, 1 - M.h / 160).toFixed(2)})`);
  e['m-spin'].setAttribute('transform', `scale(${Math.cos(M.spin).toFixed(3)} 1)`);
  e['m-flip'].setAttribute('transform', `scale(${M.face} 1)`);
  e['m-body'].setAttribute('transform', `rotate(${(lean * M.face).toFixed(1)}) translate(0 ${(-bob).toFixed(1)}) scale(${sx.toFixed(3)} ${sq.toFixed(3)})`);
  const leg = M.h > 2 ? 22 : Math.sin(M.phase) * 38 * run;
  e['m-legL'].setAttribute('transform', `rotate(${(M.h > 2 ? -leg : leg).toFixed(1)} -9 -14)`);
  e['m-legR'].setAttribute('transform', `rotate(${(-leg).toFixed(1)} 9 -14)`);
  const arm = run > .1 ? Math.sin(M.phase) * 30 * run : (M.wave > 0 ? Math.sin(t * 16) * 30 - 50 : Math.sin(t * 2) * 4);
  e['m-armL'].setAttribute('transform', `rotate(${(-arm * (run > .1 ? 1 : 0) + (run > .1 ? 0 : -Math.sin(t * 2) * 4)).toFixed(1)} -21 -36)`);
  e['m-armR'].setAttribute('transform', `rotate(${(run > .1 ? arm : (M.wave > 0 ? -arm - 40 : arm)).toFixed(1)} 21 -36)`);
  // eyes look forward while running, otherwise toward what they're watching
  const lx = run > .2 ? 2.2 : Math.max(-2.4, Math.min(2.4, M.look * M.face)), ly = Math.max(-2, Math.min(2, M.lookY));
  e['m-pup'].setAttribute('transform', `translate(${lx.toFixed(2)} ${ly.toFixed(2)})`);

}

/* ================= PARTICLES (screen space) ================= */
const fx = $('#fx'), cx2 = fx.getContext('2d');
let FW = 0, FH = 0, DPR = 1, parts = [], ambient = [];
function fitFx() {
  DPR = Math.min(2, devicePixelRatio || 1); FW = innerWidth; FH = innerHeight;
  fx.width = FW * DPR; fx.height = FH * DPR; cx2.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function toScreen(x, y) { const m = svg.getScreenCTM(); return [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f]; }
function toWorld(sx, sy) { const m = svg.getScreenCTM().inverse(); return [m.a * sx + m.c * sy + m.e, m.b * sx + m.d * sy + m.f]; }
function worldScale() { return svg.getScreenCTM().a; }

function seedAmbient(season) {
  ambient = [];
  const n = reduce ? 0 : { winter: 110, autumn: 26, spring: 34, summer: 36 }[season];
  for (let i = 0; i < n; i++) ambient.push(newAmb(season, true));
}
function newAmb(season, anywhere) {
  const a = { k: season, x: Math.random() * FW, y: anywhere ? Math.random() * FH : -12, t: Math.random() * 100 };
  if (season === 'winter') { a.s = .8 + Math.random() * 2.4; a.vy = 18 + a.s * 14; a.vx = 6; }
  if (season === 'autumn') { a.s = 3 + Math.random() * 3; a.vy = 30 + Math.random() * 30; a.vx = 20; a.c = ['#e07b2a', '#c9452f', '#e8b23a'][i3()]; a.rot = Math.random() * 6; }
  if (season === 'spring') { a.s = 2 + Math.random() * 2; a.vy = 16 + Math.random() * 16; a.vx = 14; a.c = ['#ffc9d9', '#fff1f5', '#ffb3c7'][i3()]; a.rot = Math.random() * 6; }
  if (season === 'summer') { a.y = FH * (.45 + Math.random() * .5); a.s = 1.5 + Math.random() * 1.5; a.vy = 0; a.vx = 0; }
  return a;
}
const i3 = () => Math.floor(Math.random() * 3);

function puff(wx, wy, n = 6, col = 'rgba(230,220,255,.55)', sp = 40) {
  if (reduce) return;
  const [sx, sy] = toScreen(wx, wy), k = worldScale();
  for (let i = 0; i < n; i++) parts.push({ x: sx, y: sy, vx: (Math.random() - .5) * sp * k, vy: -Math.random() * sp * .6 * k, life: .5 + Math.random() * .3, max: .8, r: (3 + Math.random() * 4) * k, col, grow: 8 * k });
}
function heart(wx, wy) {
  const [sx, sy] = toScreen(wx, wy), k = worldScale();
  for (let i = 0; i < 3; i++) parts.push({ x: sx + (i - 1) * 12 * k, y: sy, vx: (i - 1) * 10 * k, vy: -40 * k, life: 1.1, max: 1.1, r: 7 * k, heart: true });
}
function zzz(wx, wy) {
  const [sx, sy] = toScreen(wx, wy), k = worldScale();
  parts.push({ x: sx, y: sy, vx: 10 * k, vy: -18 * k, life: 1.8, max: 1.8, r: 12 * k, z: true });
}
let smokeT = 0;
function smoke(dt, season) {
  if (reduce || season === 'summer') return;
  smokeT -= dt; if (smokeT > 0) return; smokeT = .35;
  const k = worldScale();
  CHIMNEYS.forEach(([x, y]) => { const [sx, sy] = toScreen(x, y); parts.push({ x: sx, y: sy, vx: (6 + Math.random() * 8) * k, vy: -16 * k, life: 3, max: 3, r: 5 * k, col: 'rgba(200,195,225,.18)', grow: 7 * k }); });
}

function drawFx(dt, t) {
  cx2.clearRect(0, 0, FW, FH);
  for (const a of ambient) {
    a.t += dt;
    if (a.k === 'summer') {
      a.x += Math.cos(a.t * .7) * 12 * dt; a.y += Math.sin(a.t * .9) * 10 * dt;
      const g = (Math.sin(a.t * 2.3) + 1) / 2;
      cx2.fillStyle = `rgba(255,236,140,${(.25 + g * .75).toFixed(2)})`; cx2.beginPath(); cx2.arc(a.x, a.y, a.s, 0, 7); cx2.fill();
      cx2.fillStyle = `rgba(255,236,140,${(g * .15).toFixed(2)})`; cx2.beginPath(); cx2.arc(a.x, a.y, a.s * 6, 0, 7); cx2.fill();
      continue;
    }
    a.y += a.vy * dt; a.x += (Math.sin(a.t * 1.3) * a.vx + a.vx * .3) * dt;
    if (a.y > FH + 12) Object.assign(a, newAmb(a.k, false));
    if (a.k === 'winter') { cx2.fillStyle = 'rgba(245,248,255,.85)'; cx2.beginPath(); cx2.arc(a.x, a.y, a.s, 0, 7); cx2.fill(); }
    else { a.rot += dt * 2; cx2.save(); cx2.translate(a.x, a.y); cx2.rotate(a.rot); cx2.fillStyle = a.c; cx2.beginPath(); cx2.ellipse(0, 0, a.s, a.s * .55, 0, 0, 7); cx2.fill(); cx2.restore(); }
  }
  for (const p of parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.grow) p.r += p.grow * dt;
    const a = Math.max(0, p.life / p.max);
    if (p.heart) { cx2.globalAlpha = a; cx2.fillStyle = '#ff7a8a'; heartPath(p.x, p.y, p.r); cx2.globalAlpha = 1; }
    else if (p.z) { cx2.globalAlpha = a; cx2.fillStyle = '#e8e2ff'; cx2.font = `800 ${p.r.toFixed(0)}px "M PLUS Rounded 1c", sans-serif`; cx2.fillText('z', p.x, p.y); cx2.globalAlpha = 1; }
    else if (p.line) { cx2.strokeStyle = `rgba(255,240,210,${(a * .55).toFixed(2)})`; cx2.lineWidth = 2; cx2.beginPath(); cx2.moveTo(p.x, p.y); cx2.lineTo(p.x + p.len, p.y); cx2.stroke(); }
    else { cx2.globalAlpha = a; cx2.fillStyle = p.col; cx2.beginPath(); cx2.arc(p.x, p.y, p.r, 0, 7); cx2.fill(); cx2.globalAlpha = 1; }
  }
  parts = parts.filter(p => p.life > 0);
}
function heartPath(x, y, s) {
  cx2.beginPath(); cx2.moveTo(x, y + s * .35);
  cx2.bezierCurveTo(x - s, y - s * .4, x - s * .45, y - s, x, y - s * .45);
  cx2.bezierCurveTo(x + s * .45, y - s, x + s, y - s * .4, x, y + s * .35); cx2.fill();
}

streetEl.addEventListener('click', e => {
  const [wx, wy] = toWorld(e.clientX, e.clientY); wake();
  const door = e.target.closest && e.target.closest('.door');
  if (door) { open(door.dataset.id); return; }
  if (Math.abs(wx - M.x) < 44 && wy > FEET - M.h - 120 && wy < FEET - M.h + 8) { poke(); return; }
  closePop(); M.target = Math.max(40, Math.min(1560, wx));
});
function poke() {
  if (M.h < 4) M.vh = 640; M.spin = Math.PI * 2; M.mood = 'grin'; setTimeout(() => M.mood = 'smile', 900);
  heart(M.x, FEET - 100); say(pick(L().poke), 1600);
}
$$('.door').forEach(d => {
  d.addEventListener('focus', () => hoverDoor(d.dataset.id));
  d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(d.dataset.id); } });
});
$$('[data-close]').forEach(b => b.addEventListener('click', () => { const s = b.closest('.sheet, .room'); s.hidden = true; if (s.classList.contains('room')) closeRooms(); }));
addEventListener('keydown', e => {
  wake();
  if (e.key === 'Escape') { closePop(); closeRooms(); toggleWardrobe(false); return; }
  if (e.target.closest && e.target.closest('button, a, .door, input')) return;
  if (e.key === 'ArrowLeft') M.target = Math.max(40, M.x - 220);
  if (e.key === 'ArrowRight') M.target = Math.min(1560, M.x + 220);
  if (e.key === ' ') { e.preventDefault(); poke(); }
});
addEventListener('pointerdown', e => {
  if (!$('#pop').hidden && !e.target.closest('#pop') && !e.target.closest('.door')) closePop();
});
addEventListener('resize', () => { fitFx(); placePop(); });
streetEl.addEventListener('scroll', placePop, { passive: true });

/* ---- loop ---- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000), t = now / 1000; last = now;
  // chase the target: quick acceleration, tiny overshoot = springy and nimble
  const dx = M.target - M.x;
  const want = Math.max(-1100, Math.min(1100, dx * 7));
  const before = M.vx;
  M.vx += (want - M.vx) * Math.min(1, dt * 11);
  if (Math.abs(dx) < 2 && Math.abs(M.vx) < 20) M.vx = 0;
  M.x += M.vx * dt;
  if (Math.abs(M.vx) > 30) { M.face = M.vx > 0 ? 1 : -1; M.phase += dt * Math.abs(M.vx) / 16; }
  if (Math.abs(before) < 120 && Math.abs(M.vx) > 250 && M.h < 2) puff(M.x - M.face * 14, FEET - 2, 5);
  if (Math.abs(before) > 500 && Math.abs(M.vx) < 150 && M.h < 2) { puff(M.x + M.face * 12, FEET - 2, 6); M.squash = .8; }
  if (Math.abs(M.vx) > 800 && !reduce && Math.random() < .5) {
    const [sx, sy] = toScreen(M.x - M.face * 30, FEET - 30 - Math.random() * 50), k = worldScale();
    parts.push({ x: sx, y: sy, vx: 0, vy: 0, life: .18, max: .18, line: true, len: -M.face * (18 + Math.random() * 20) * k });
  }
  // jump & squash
  M.vh -= 2600 * dt; M.h += M.vh * dt;
  if (M.h <= 0) { if (M.vh < -300) { M.squash = .72; puff(M.x, FEET - 2, 6); } M.h = 0; M.vh = 0; }
  M.squash += (1 - M.squash) * Math.min(1, dt * 12);
  if (M.h > 0 && M.vh > 0) M.squash = Math.max(M.squash, 1.08);
  M.spin = Math.max(0, M.spin - dt * 14);
  M.wave = Math.max(0, M.wave - dt);
  // look at pointer, or the open door
  const lookAt = pointer || (openDoor ? [DOORS[openDoor].cx, GROUND - 90] : null);
  if (lookAt) { M.look = (lookAt[0] - M.x) / 60; M.lookY = (lookAt[1] - (FEET - 60)) / 80; } else { M.look *= .95; M.lookY *= .95; }
  // blink / sleep / chatter
  M.blinkT -= dt; if (M.blinkT < 0) { M.blink = 1; M.blinkT = 2 + Math.random() * 4; }
  M.blink = Math.max(0, M.blink - dt * 8);
  if (!M.sleeping && now - lastInput > 16000 && Math.abs(M.vx) < 5) { M.sleeping = true; say('Zzz…', 1500); }
  if (M.sleeping && Math.random() < dt * .8) zzz(M.x + 18, FEET - 90);
  bubbleT -= dt; if (bubbleT <= 0) bubble.classList.add('off');
  chatT -= dt; if (chatT <= 0 && !M.sleeping && $('#wardrobe').hidden) { say(pick(L().idle)); M.wave = 1.2; }
  // idle wandering when nobody steers
  if (!pointer && !openDoor && Math.abs(M.vx) < 5 && Math.random() < dt * .12 && !M.sleeping) M.target = Math.max(80, Math.min(1520, M.x + (Math.random() - .5) * 500));
  renderMascot(t); placeBubble();
  // doors
  for (const id in DOORS) {
    const D = DOORS[id];
    D.open += (D.target - D.open) * Math.min(1, dt * 9);
    const k = 1 - .78 * D.open;
    D.leaf.setAttribute('transform', `translate(${D.x0} ${GROUND}) scale(${k.toFixed(3)} ${(1 - .04 * D.open).toFixed(3)}) translate(${-D.x0} ${-GROUND})`);
    D.spill.setAttribute('opacity', (D.open * .9).toFixed(2));
    // everyone watches Dverka; the hovered door watches you
    const awake = hovered === id || openDoor === id;
    const tx = awake && pointer ? pointer[0] : M.x, ty = awake && pointer ? pointer[1] : FEET - 50 - M.h;
    const vx = tx - D.cx, vy = ty - D.eyeY, vl = Math.hypot(vx, vy) || 1;
    D.pup.setAttribute('transform', `translate(${(vx / vl * 3).toFixed(2)} ${(vy / vl * 2.6).toFixed(2)})`);
    D.blinkT -= dt; if (D.blinkT < 0) { D.blink = 1; D.blinkT = 2 + Math.random() * 6; }
    D.blink = Math.max(0, D.blink - dt * 7);
    const base = awake ? 0 : D.lid;
    D.lidEl.setAttribute('height', (Math.max(base, D.blink) * (D.ery * 2 + 2)).toFixed(1));
    D.mouthO.setAttribute('opacity', awake ? 1 : 0);
    if (D.mouth) D.mouth.setAttribute('opacity', awake ? 0 : 1);
    // signs swing when Dverka zooms past
    if (Math.abs(M.x - D.cx) < 50 && Math.abs(M.vx) > 400) D.sv += M.vx / 1100 * dt * 40;
    D.sv += (-D.sa * 40 - D.sv * 3) * dt; D.sa += D.sv * dt;
    D.sign.setAttribute('transform', `rotate(${(D.sa * 6).toFixed(2)} ${D.cx} ${GROUND - D.dh - 50})`);
  }
  // windows: somebody turns a light on or off now and then
  if (Math.random() < dt * .25) { const w = pick(winEls); w.classList.toggle('lit'); }
  // clock
  if (Math.floor(t) !== frame.sec) { frame.sec = Math.floor(t); tickClock(); }
  smoke(dt, season); drawFx(dt, t);
  requestAnimationFrame(frame);
}
function tickClock() {
  let h, m;
  try { const p = new Intl.DateTimeFormat('en-GB', { hour: 'numeric', minute: 'numeric', hour12: false, timeZone: 'Europe/Bratislava' }).formatToParts(new Date()); h = +p.find(x => x.type === 'hour').value; m = +p.find(x => x.type === 'minute').value; }
  catch (e) { const d = new Date(); h = d.getHours(); m = d.getMinutes(); }
  const c = HOUSES[0], cx = c.x + c.w / 2, cy = GROUND - c.h + 34 + 8 + 26;
  $('#clock-h').setAttribute('transform', `rotate(${(h % 12) * 30 + m / 2} ${cx} ${cy})`);
  $('#clock-m').setAttribute('transform', `rotate(${m * 6} ${cx} ${cy})`);
}

/* ---- boot ---- */
buildScene(); mountMascot();
const winEls = $$('.win').filter(w => !w.closest('.door'));
fitFx(); renderUI(); setSeason(season, false); applyOutfit();
streetEl.scrollLeft = ($('#scene').offsetWidth - innerWidth) / 2;
M.x = 800; M.target = 800;
setTimeout(() => { say(L().hello, 4200); M.wave = 1.6; }, 500);
requestAnimationFrame(frame);

</script>

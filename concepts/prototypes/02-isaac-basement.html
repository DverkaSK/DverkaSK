<title>Dverka Basement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Silkscreen&display=swap">
<style>
  :root {
    --void: #0a0705;
    --paper: #e9dcc0;
    --paper-dk: #cdbb95;
    --ink: #2a1a12;
    --chalk: rgba(240, 224, 196, .55);
    --blood: #b3122b;
    --hand: "Caveat Brush", "Comic Sans MS", "Chalkboard SE", cursive;
    --pix: "Silkscreen", "Courier New", monospace;
    --s: 2;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--void); color: var(--paper);
    display: grid; place-items: center; overflow: hidden;
    font: 14px/1.4 var(--pix); user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #game { position: relative; width: calc(464px * var(--s)); height: calc(304px * var(--s)); }
  #cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
  #over { position: absolute; inset: 0; pointer-events: none; }

  .lbl {
    position: absolute; transform: translate(-50%, -50%);
    font: max(9px, calc(var(--s) * 6px)) / 1 var(--pix); letter-spacing: .08em;
    color: var(--chalk); white-space: nowrap; transition: color .2s, transform .2s;
  }
  .lbl.near { color: #fff; transform: translate(-50%, -50%) scale(1.15); text-shadow: 0 0 calc(var(--s) * 3px) rgba(255, 220, 160, .6); }

  .streak {
    position: absolute; left: 50%; top: 15%; transform: translateX(-50%);
    padding: .15em 1.6em .35em; text-align: center; color: var(--ink);
    background: linear-gradient(180deg, var(--paper), var(--paper-dk));
    clip-path: polygon(2% 8%, 12% 0, 30% 6%, 52% 1%, 71% 7%, 88% 0, 99% 10%, 97% 52%, 100% 90%, 84% 100%, 63% 94%, 41% 100%, 20% 93%, 4% 100%, 0 60%);
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.4));
    opacity: 0; pointer-events: none;
  }
  .streak b { display: block; font: calc(var(--s) * 20px) / 1.05 var(--hand); letter-spacing: .02em; }
  .streak span { display: block; font: calc(var(--s) * 9px) / 1.2 var(--hand); opacity: .8; }
  .streak.show { animation: streak 3.2s ease-out forwards; }
  @keyframes streak {
    0% { opacity: 0; transform: translateX(-120%) rotate(-2deg); }
    10% { opacity: 1; transform: translateX(-50%) rotate(-1deg); }
    82% { opacity: 1; transform: translateX(-50%) rotate(0); }
    100% { opacity: 0; transform: translateX(40%) rotate(1deg); }
  }

  #card {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: auto;
    background: rgba(8, 5, 3, .9); animation: fade .35s ease-out;
  }
  @keyframes fade { from { opacity: 0; } }
  .note {
    width: min(86%, calc(var(--s) * 230px)); padding: calc(var(--s) * 12px) calc(var(--s) * 16px);
    color: var(--ink); background: linear-gradient(180deg, var(--paper), var(--paper-dk));
    clip-path: polygon(0 3%, 18% 0, 46% 2%, 74% 0, 100% 4%, 98% 50%, 100% 97%, 70% 100%, 38% 98%, 10% 100%, 1% 96%, 2% 45%);
    transform: rotate(-1.2deg); display: grid; gap: calc(var(--s) * 6px);
  }
  .note h2 { margin: 0; font: calc(var(--s) * 24px) / 1 var(--hand); text-wrap: balance; }
  .note .url { font: max(10px, calc(var(--s) * 6px)) / 1.4 var(--pix); color: #6b4a2f; word-break: break-all; }
  .note p { margin: 0; font: calc(var(--s) * 9px) / 1.3 var(--hand); }
  .note .row { display: flex; gap: calc(var(--s) * 6px); flex-wrap: wrap; margin-top: calc(var(--s) * 2px); }
  .note a, .note button {
    font: max(10px, calc(var(--s) * 6px)) / 1 var(--pix); letter-spacing: .06em; cursor: pointer; text-decoration: none;
    padding: calc(var(--s) * 4px) calc(var(--s) * 7px); border: 2px solid var(--ink); background: transparent; color: var(--ink);
  }
  .note a { background: var(--ink); color: var(--paper); }
  .note a:hover, .note button:hover { background: var(--blood); border-color: var(--blood); color: var(--paper); }
  .note a:focus-visible, .note button:focus-visible { outline: 2px dashed var(--blood); outline-offset: 3px; }

  #help {
    position: fixed; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    font: 10px/1.4 var(--pix); color: rgba(233, 220, 192, .45); text-align: right; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { .streak.show { animation-duration: .01s; opacity: 1; } #card { animation: none; } }
</style>

<div id="game">
  <canvas id="cv" aria-label="Basement room with doors to GitHub, SpigotMC, Modrinth, WakaTime, Telegram and e-mail"></canvas>
  <div id="over"></div>
  <div class="streak" id="streak"><b>DVERKA.SK</b><span>Basement I</span></div>
  <div id="card" hidden role="dialog" aria-modal="true" aria-labelledby="card-t">
    <div class="note">
      <h2 id="card-t">GitHub</h2>
      <div class="url" id="card-url"></div>
      <p id="card-p"></p>
      <div class="row">
        <a id="card-open" href="#" target="_blank" rel="noopener">OPEN ↗</a>
        <button id="card-back" type="button">BACK TO THE BASEMENT</button>
      </div>
    </div>
  </div>
</div>
<div id="help">concept · own sprites · click to walk</div>

function fit() {

const OUT = { top: [0, -1], bottom: [0, 1], left: [-1, 0], right: [1, 0] };
const ROT = { top: 0, bottom: Math.PI, left: -Math.PI / 2, right: Math.PI / 2 };
function doorEdge(d) {
  switch (d.side) {
    case 'top': return [d.p, FY0]; case 'bottom': return [d.p, FY1];

/* ---------- images ---------- */
const img = src => { const i = new Image(); i.src = src; return i; };

const MOD = img(MODRINTH);

/* ---------- helpers ---------- */
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill(); }
function circ(c, x, y, r) { ell(c, x, y, r, r); }
const inFloor = (x, y) => x > FX0 && x < FX1 && y > FY0 && y < FY1;

/* ---------- baked background ---------- */
const bgC = document.createElement('canvas'); bgC.width = VW; bgC.height = VH;
const bg = bgC.getContext('2d');
function bake() {
  const r = rnd(42);
  bg.fillStyle = '#3a2618'; bg.fillRect(0, 0, VW, VH);
  // wall rubble texture
  const wc = ['#4a3120', '#2e1d12', '#553925', '#432c1c'];
  for (let i = 0; i < 1400; i++) {
    const x = r() * VW, y = r() * VH;
    if (inFloor(x, y)) continue;
    bg.fillStyle = wc[i % 4];
    const s = 2 + r() * 7 | 0; bg.fillRect(x | 0, y | 0, s, s * (.5 + r() * .6) | 0);
  }
  // wall slopes darken toward the room
  const sl = [[0, 0, VW, WB, 0, 0, 0, WB], [0, FY1, VW, WB, 0, VH, 0, FY1], [0, 0, WB, VH, 0, 0, WB, 0], [FX1, 0, WB, VH, VW, 0, FX1, 0]];
  sl.forEach(([x, y, w, h, x0, y0, x1, y1]) => {
    const gr = bg.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, 'rgba(0,0,0,.45)'); gr.addColorStop(.6, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.25)');
    bg.fillStyle = gr; bg.fillRect(x, y, w, h);
  });
  // floor
  const fd = bg.createImageData(FX1 - FX0, FY1 - FY0);
  for (let y = 0; y < fd.height; y++) for (let x = 0; x < fd.width; x++) {
    const i = (y * fd.width + x) * 4, n = (r() - .5) * 14;
    const seam = (x % 32 === 0 || y % 32 === 0) ? -8 : 0;
    fd.data[i] = 98 + n + seam; fd.data[i + 1] = 68 + n + seam; fd.data[i + 2] = 46 + n * .7 + seam; fd.data[i + 3] = 255;
  }
  bg.putImageData(fd, FX0, FY0);
  for (let i = 0; i < 40; i++) { // stains
    bg.fillStyle = `rgba(${r() < .5 ? '30,18,10' : '120,90,60'},${.06 + r() * .06})`;
    ell(bg, FX0 + r() * 352, FY0 + r() * 192, 6 + r() * 18, 4 + r() * 10);
  }
  // ledge
  bg.fillStyle = '#6b4b33'; bg.fillRect(FX0 - 2, FY0 - 2, 356, 2); bg.fillRect(FX0 - 2, FY1, 356, 2);
  bg.fillRect(FX0 - 2, FY0 - 2, 2, 196); bg.fillRect(FX1, FY0 - 2, 2, 196);
  // shadow the walls cast
  const sh = bg.createLinearGradient(0, FY0, 0, FY0 + 14);
  sh.addColorStop(0, 'rgba(0,0,0,.45)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  bg.fillStyle = sh; bg.fillRect(FX0, FY0, 352, 14);
  // vignette
  const vg = bg.createRadialGradient(VW / 2, VH / 2, 60, VW / 2, VH / 2, 250);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  bg.fillStyle = vg; bg.fillRect(0, 0, VW, VH);
  // chalk controls on the floor
  bg.save();
  bg.fillStyle = 'rgba(236,220,190,.28)'; bg.strokeStyle = 'rgba(236,220,190,.28)'; bg.lineWidth = 1;
  bg.font = '8px Silkscreen, monospace'; bg.textAlign = 'center'; bg.textBaseline = 'middle';
  const key = (x, y, t, w = 11) => { bg.strokeRect(x - w / 2 + .5, y - 5.5, w, 11); bg.fillText(t, x + .5, y + .5); };
  key(164, 176, 'W'); key(152, 189, 'A'); key(164, 189, 'S'); key(176, 189, 'D'); bg.fillText('MOVE', 164, 205);
  key(300, 176, '↑'); key(288, 189, '←'); key(300, 189, '↓'); key(312, 189, '→'); bg.fillText('CRY', 300, 205);
  key(232, 196, 'E'); bg.fillText('BOMB', 232, 209);
  bg.fillText('WALK INTO A DOOR', 232, 112);
  bg.restore();
  // hairline cracks where the secret wall is
  bg.strokeStyle = 'rgba(15,8,4,.8)'; bg.lineWidth = 1; bg.beginPath();
  bg.moveTo(110, FY1 + 4); bg.lineTo(116, FY1 + 11); bg.lineTo(112, FY1 + 18); bg.moveTo(116, FY1 + 11); bg.lineTo(126, FY1 + 14); bg.lineTo(131, FY1 + 22);
  bg.stroke();
}

function plaque(x, y) { g.fillStyle = 'rgba(20,12,7,.75)'; g.fillRect(x - 12, y - 12, 24, 24); g.fillStyle = 'rgba(255,230,190,.1)'; g.fillRect(x - 12, y - 12, 24, 1); }
const LOGO = {
  gh(x, y) {
    g.save(); g.fillStyle = '#f4f1ea'; circ(g, x, y, 10); g.beginPath(); g.arc(x, y, 10, 0, Math.PI * 2); g.clip();
    g.fillStyle = '#181717';
    ell(g, x, y - 1, 6, 5);
    g.beginPath(); g.moveTo(x - 6, y - 3); g.lineTo(x - 5, y - 9); g.lineTo(x - 2, y - 5); g.fill();
    g.beginPath(); g.moveTo(x + 6, y - 3); g.lineTo(x + 5, y - 9); g.lineTo(x + 2, y - 5); g.fill();
    g.fillRect(x - 2.5, y + 2, 5, 9);
    g.fillRect(x - 7, y + 3, 5, 1.5);
    g.restore();
  },
  sp(x, y) {

    g.fillStyle = '#9aa1a7'; g.fillRect(x - 8, y - 3, 14, 2);

    g.beginPath(); g.moveTo(x - 4.5, y - 1); g.lineTo(x - 2.2, y + 3); g.lineTo(x, y - .5); g.lineTo(x + 2.2, y + 3); g.lineTo(x + 5, y - 3.5); g.stroke();
  },
  tg(x, y) {
    g.fillStyle = '#2aabee'; circ(g, x, y, 10);
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(x - 6, y); g.lineTo(x + 5.5, y - 5); g.lineTo(x + 3.5, y + 5.5); g.lineTo(x - .5, y + 2.5); g.lineTo(x - 2, y + 5); g.lineTo(x - 2, y + 1.5); g.closePath(); g.fill();
    g.fillStyle = '#c8daea'; g.beginPath(); g.moveTo(x - 2, y + 1.5); g.lineTo(x + 4, y - 3); g.lineTo(x - .5, y + 2.5); g.fill();
  },
  em(x, y) {
    g.fillStyle = '#e9dcc0'; g.fillRect(x - 9, y - 6, 18, 12);
    g.strokeStyle = '#2a1a12'; g.lineWidth = 1; g.strokeRect(x - 8.5, y - 5.5, 17, 11);
    g.beginPath(); g.moveTo(x - 8.5, y - 5.5); g.lineTo(x, y + 1); g.lineTo(x + 8.5, y - 5.5); g.stroke();
  },
  sc(x, y) { g.fillStyle = '#b3122b'; g.font = '16px Silkscreen, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', x, y + 1); },
};

/* ---------- door sprites (drawn facing "top", rotated per wall) ---------- */
function drawDoor(d) {
  const [ex, ey] = doorEdge(d);
  if (d.hidden) return;
  g.save(); g.translate(ex, ey); g.rotate(ROT[d.side]);

  const blink = b.t < .6 ? Math.sin(b.t * 40) > 0 : Math.sin(b.t * 14) > 0;
  g.fillStyle = 'rgba(0,0,0,.35)'; ell(g, b.x, b.y + 4, 6, 2);
  g.fillStyle = blink ? '#8a1a1a' : '#222'; circ(g, b.x, b.y - 2, 5.5);
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(b.x - 3, b.y - 5, 2, 2);
  g.fillStyle = '#c9a36b'; g.fillRect(b.x, b.y - 10, 1, 3);
  g.fillStyle = '#ffcf5a'; g.fillRect(b.x - (Math.random() < .5 ? 1 : 0), b.y - 11, 2, 2);
}
function heart(x, y, col) {
  g.fillStyle = '#1d1210'; g.fillRect(x + 1, y, 3, 1); g.fillRect(x + 5, y, 3, 1); g.fillRect(x, y + 1, 9, 4); g.fillRect(x + 1, y + 5, 7, 1); g.fillRect(x + 2, y + 6, 5, 1); g.fillRect(x + 3, y + 7, 3, 1);
  g.fillStyle = col; g.fillRect(x + 1, y + 1, 3, 4); g.fillRect(x + 5, y + 1, 3, 4); g.fillRect(x + 2, y + 5, 5, 1); g.fillRect(x + 3, y + 6, 3, 1); g.fillRect(x + 4, y + 1, 1, 4);
  g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(x + 2, y + 2, 1, 1);
}
function hud() {
  for (let i = 0; i < 3; i++) heart(8 + i * 11, 7, '#c8102e');
  heart(41, 7, '#6f8bd6');
  g.font = '8px Silkscreen, monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
  const row = (y, icon, n) => { icon(12, y); g.fillStyle = '#fff'; g.fillText(String(n).padStart(2, '0'), 20, y + 1); };
  row(24, (x, y) => { g.fillStyle = '#e3a91a'; circ(g, x, y, 3); g.fillStyle = '#ffe07a'; g.fillRect(x - 1, y - 2, 1, 2); }, coins);
  row(34, (x, y) => { g.fillStyle = '#222'; circ(g, x, y + 1, 3); g.fillStyle = '#ffcf5a'; g.fillRect(x, y - 3, 1, 2); }, bombsN);
  row(44, (x, y) => { g.fillStyle = '#e3c25a'; circ(g, x - 1, y - 1, 2); g.fillRect(x, y - 1, 4, 1); g.fillRect(x + 2, y, 1, 2); }, keysN);
  // minimap
  const mx = VW - 56, my = 5;
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(mx, my, 51, 44);
  const room = (x, y, w, h, id) => {
    const on = id && visited.has(id);
    g.fillStyle = '#111'; g.fillRect(mx + x - 1, my + y - 1, w + 2, h + 2);
    g.fillStyle = id ? (on ? '#c9c9c9' : '#6b6b6b') : '#fff'; g.fillRect(mx + x, my + y, w, h);
  };
  room(13, 13, 25, 17, null);
  [['gh', 14], ['sp', 22], ['mr', 30]].forEach(([id, x]) => room(x, 5, 6, 5, id));
  room(4, 18, 6, 6, 'wk'); room(41, 18, 6, 6, 'tg'); room(22, 33, 6, 5, 'em');
  if (!DOORS[6].hidden) room(14, 33, 5, 5, 'sc');
}
function draw(T) {
  g.save();
  if (shake > 0 && !reduce) g.translate((Math.random() - .5) * 4 * shake * 3, (Math.random() - .5) * 4 * shake * 3);
  g.drawImage(bgC, 0, 0);
  DOORS.forEach(drawDoor);
  const list = [];
  props.forEach(o => o.hp > 0 && list.push([o.y, () => o.k === 'rock' ? drawRock(o) : drawPoop(o)]));
  bombs.forEach(b => list.push([b.y, () => drawBomb(b)]));
  if (pedestal) list.push([pedestal.y, () => drawPedestal(pedestal, T)]);
  if (state === 'play') list.push([P.y, drawPlayer]);
  flies.forEach(f => list.push([f.y + 2, () => drawFly(f)]));
  list.sort((a, b) => a[0] - b[0]).forEach(([, fn]) => fn());
  for (const t of tears) {
    g.fillStyle = 'rgba(0,0,0,.3)'; ell(g, t.x, t.y + 1, 2.5, 1);
    g.fillStyle = '#3b6d99'; circ(g, t.x, t.y - t.z, 3);
    g.fillStyle = '#bfe3ff'; circ(g, t.x, t.y - t.z, 2.2);
    g.fillStyle = '#fff'; g.fillRect(t.x - 1, t.y - t.z - 2, 1, 1);
  }
  for (const p of parts) { g.globalAlpha = Math.min(1, p.life * 3); g.fillStyle = p.col; g.fillRect(p.x | 0, p.y | 0, p.s, p.s); }
  g.globalAlpha = 1;
  g.restore();
  hud();
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); updateParts(dt); draw(now / 1000);
  requestAnimationFrame(frame);
}

bake();
(document.fonts ? document.fonts.load('8px Silkscreen') : Promise.resolve()).then(() => bake()).catch(() => {});
setTimeout(() => banner('DVERKA.SK', 'Basement I'), 250);
requestAnimationFrame(frame);
</script>

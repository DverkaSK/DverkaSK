<style>
  :root {
    --bg: #0b0910;

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--paper); font: 11px/1.4 var(--pix); overflow: hidden; }
  #view { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #view.hot { cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .bubble {

    padding: 7px 10px; background: var(--paper); color: var(--ink); font: 11px/1.3 var(--pix);
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s;
    box-shadow: 0 0 0 2px var(--ink), 4px 4px 0 2px rgba(0,0,0,.45);
  }

  .bubble.on { opacity: 1; }
  .bubble.small { font-size: 9px; padding: 5px 7px; }
  .corner { position: fixed; z-index: 2; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 10px; color: var(--dim); pointer-events: none; text-shadow: 2px 2px 0 #000; }
  .corner b { color: var(--warm); font-weight: normal; }
  .hint { position: fixed; z-index: 2; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 10px; color: var(--dim); pointer-events: none; text-shadow: 2px 2px 0 #000; white-space: nowrap; }
  .pix { position: fixed; z-index: 4; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; align-items: center; font-size: 9px; color: var(--dim); text-shadow: 2px 2px 0 #000; }
  .pix button { font: 9px/1 var(--pix); color: var(--dim); background: rgba(20,14,26,.75); border: 0; padding: 7px 8px; cursor: pointer; box-shadow: 0 0 0 2px #2a2030; }
  .pix button:hover { color: var(--paper); }
  .pix button.on { color: var(--ink); background: var(--warm); box-shadow: 0 0 0 2px var(--ink); }
  .pix button:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
</style>

<script>
/* ================= crisp pixel primitives (no anti-aliasing anywhere) ================= */
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d', { willReadFrequently: true }); g.imageSmoothingEnabled = false; return [c, g]; }
function rect(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function dot(g, x, y, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
function poly(g, pts, col) {
  g.fillStyle = col;
  let y0 = Infinity, y1 = -Infinity; pts.forEach(p => { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
  for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
    const yc = y + .5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax));
    }
    xs.sort((a, b) => a - b);
    for (let i = 0; i + 1 < xs.length; i += 2) { const a = Math.round(xs[i]), b = Math.round(xs[i + 1]); if (b > a) g.fillRect(a, y, b - a, 1); }
  }
}
function ell(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    const dy = (y + .5 - cy) / ry; if (Math.abs(dy) > 1) continue;
    const w = rx * Math.sqrt(1 - dy * dy), a = Math.round(cx - w), b = Math.round(cx + w);

}
function line(g, x0, y0, x1, y1, col) {
  g.fillStyle = col; x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1; let e = dx + dy;

function path(g, pts, col) { for (let i = 0; i + 1 < pts.length; i++) line(g, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], col); }
/* smooth a polyline (Catmull-Rom) so curves come out as clean pixel arcs */
function smooth(pts, n = 6) {

function curve(g, pts, col) { path(g, smooth(pts), col); }
function yAt(pts, x) { const s = smooth(pts, 10); for (let i = 0; i + 1 < s.length; i++) { const [ax, ay] = s[i], [bx, by] = s[i + 1]; if ((ax <= x && bx >= x) || (bx <= x && ax >= x)) return ay + (x - ax) / ((bx - ax) || 1) * (by - ay); } return s[s.length - 1][1]; }
/* black outline around every opaque pixel of a sprite */
function outline(c, col = '#111') {

  const w = c.width, h = c.height, mark = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; if (!a(i)) continue;
    if (x === 0 || y === 0 || x === w - 1 || y === h - 1 || !a(i - 1) || !a(i + 1) || !a(i - w) || !a(i + w)) mark.push([x, y]);

}
const S = (pts, s, ox = 0, oy = 0) => pts.map(([x, y]) => [x * s + ox, y * s + oy]);

/* ================= FACES — drawn big so they read instantly ================= */
const K = '#141414';
function trollFace(mirror) {
  const W = 42, H = 39, s = W / 48;
  const [c, g] = mk(W, H);

  outline(c, K);

  const bot = [[4, 21], [7, 27], [13, 32], [21, 35], [29, 35], [36, 32], [42, 26], [45, 18]];

  curve(g, S([[27, 12], [31, 10], [35, 10], [39, 12]], s), K); curve(g, S([[28, 14], [33, 15], [38, 13]], s), K);

  curve(g, S([[20, 3.5], [24, 2.8], [28, 3.5]], s), K);
  line(g, 23.5 * s, 11 * s, 24 * s, 13.5 * s, K);
  curve(g, S([[23, 15], [24, 18], [22, 20], [20, 19]], s), K); dot(g, 25 * s, 19 * s, K);
  line(g, 9 * s, 17 * s, 6 * s, 20.5 * s, K); line(g, 40 * s, 16 * s, 43.5 * s, 19 * s, K);
  curve(g, S([[18, 38], [25, 39.8], [31, 38]], s), K); line(g, 22 * s, 41 * s, 28 * s, 41 * s, K);

}
function omgFace() {
  const W = 38, H = 40; const [c, g] = mk(W, H);
  poly(g, [[8, 3], [19, 0], [30, 3], [36, 11], [37, 22], [34, 31], [27, 38], [19, 40], [11, 38], [4, 31], [1, 21], [2, 11]], '#fbfbf7');
  poly(g, [[30, 3], [36, 11], [37, 22], [34, 31], [31, 30], [33, 20], [32, 10]], '#e4e3dc');
  outline(c, K);
  [[12, 14], [26, 14]].forEach(([x, y]) => { ell(g, x, y, 6, 6.5, K); ell(g, x, y, 5, 5.5, '#ffffff'); rect(g, x, y, 1, 1, K); });
  curve(g, [[6, 6], [11, 4], [16, 6]], K); curve(g, [[22, 6], [27, 4], [32, 6]], K);
  line(g, 19, 19, 20, 22, K);
  ell(g, 19, 30, 7, 7.5, K); ell(g, 19, 32, 4.5, 3.5, '#7a1f2a'); rect(g, 15, 24, 9, 2, '#ffffff');
  line(g, 4, 25, 7, 28, K); line(g, 34, 25, 31, 28, K);
  return c;
}
function bagFace(t) {
  const W = 38, H = 42; const [c, g] = mk(W, H);
  rect(g, 1, 4, 36, 38, '#b98a55'); rect(g, 31, 4, 6, 38, '#a0744a');
  for (let x = 1; x < 37; x += 3) rect(g, x, 1 + ((x / 3) % 2) * 2, 3, 4, '#c9a06a');
  rect(g, 1, 6, 36, 2, '#caa06a');
  line(g, 7, 8, 7, 40, '#a57a4b'); line(g, 30, 8, 30, 40, '#96693f');
  for (let i = 0; i < 25; i++) dot(g, 2 + rnd() * 34, 8 + rnd() * 33, rnd() < .5 ? '#c29560' : '#a8784a');
  [[9, 14], [22, 14]].forEach(([x, y]) => { rect(g, x, y, 7, 5, '#120a06'); rect(g, x + 1, y - 1, 5, 7, '#120a06'); if (!t.blink) rect(g, x + 3, y + 2, 2, 2, '#f3efe6'); });
  rect(g, 8, 26, 22, 9, '#c0392b'); rect(g, 13, 27, 12, 2, '#f2c14e'); rect(g, 12, 29, 14, 2, '#6b3a1c'); rect(g, 13, 31, 12, 2, '#f2c14e');

/* ================= THE ROOM (scene space 384×216, one-point perspective) ================= */
const BW = { x0: 64, x1: 320, y0: 18, y1: 146 }; // back wall
const M = 8; // parallax margin
let W = 384, H = 216, OX = 0, OY = 0;
const EXT = {}; // canvas corners in scene space
const WIN = {}; // window quad for the emissive pass
const GARLAND = [], TREE_LIGHTS = [];
const SEATS = [123, 169, 215, 261];

function wallTop(x) { return EXT.Y0 + (BW.y0 - EXT.Y0) * (x - EXT.X0) / (BW.x0 - EXT.X0); }
function wallBot(x) { return EXT.Y1 + (BW.y1 - EXT.Y1) * (x - EXT.X0) / (BW.x0 - EXT.X0); }

function drawBack(g) {
  const { X0, Y0, X1, Y1 } = EXT;

  poly(g, [[X0, Y0], [X1, Y0], [BW.x1, BW.y0], [BW.x0, BW.y0]], '#4a3b36');
  poly(g, [[X0, Y0], [BW.x0, BW.y0], [BW.x0, BW.y1], [X0, Y1]], '#a08a66');
  poly(g, [[X1, Y0], [X1, Y1], [BW.x1, BW.y1], [BW.x1, BW.y0]], '#a08a66');
  for (let i = 1; i < 9; i++) {
    const k = Math.pow(i / 9, .75);
    const xl = X0 + (BW.x0 - X0) * k, xr = X1 - (X1 - BW.x1) * k;
    line(g, xl, Y0 + (BW.y0 - Y0) * k + 1, xl, Y1 + (BW.y1 - Y1) * k - 1, '#927c5a');
    line(g, xr, Y0 + (BW.y0 - Y0) * k + 1, xr, Y1 + (BW.y1 - Y1) * k - 1, '#927c5a');
    for (let r = 1; r < 6; r++) { const yy = (Y0 + (BW.y0 - Y0) * k) + ((Y1 + (BW.y1 - Y1) * k) - (Y0 + (BW.y0 - Y0) * k)) * r / 6; dot(g, xl + 3, yy, '#7d5a44'); dot(g, xr - 3, yy, '#7d5a44'); }

  for (let i = 0; i <= 16; i++) line(g, BW.x0 + 16 * i, BW.y1, X0 + (X1 - X0) * i / 16, Y1, '#5b3c26');
  for (let k = 1; k < 9; k++) { const y = BW.y1 + (Y1 - BW.y1) * Math.pow(k / 9, 1.7); const f = (y - BW.y1) / (Y1 - BW.y1); line(g, BW.x0 + (X0 - BW.x0) * f, y, BW.x1 + (X1 - BW.x1) * f, y, '#63432b'); }
  // wallpaper on the back wall
  rect(g, BW.x0, BW.y0, BW.x1 - BW.x0, BW.y1 - BW.y0, '#b49d76');
  for (let x = BW.x0; x < BW.x1; x += 12) rect(g, x, BW.y0, 2, BW.y1 - BW.y0, '#a68f69');
  for (let y = BW.y0 + 6; y < BW.y1; y += 12) for (let x = BW.x0 + 6 + ((y / 12 | 0) % 2) * 6; x < BW.x1; x += 12) { dot(g, x, y, '#8a5d45'); rect(g, x - 1, y + 1, 3, 1, '#8a5d45'); dot(g, x, y + 2, '#6f7a4a'); }
  rect(g, BW.x0, BW.y1 - 4, BW.x1 - BW.x0, 4, '#5a3a26');
  line(g, X0, Y1 - 2, BW.x0, BW.y1 - 1, '#5a3a26'); line(g, X1, Y1 - 2, BW.x1, BW.y1 - 1, '#5a3a26');
  // ковёр на стене
  const R = { x0: 122, x1: 262, y0: 26, y1: 104 };
  rect(g, R.x0, R.y0, R.x1 - R.x0, R.y1 - R.y0, '#6e1419');
  rect(g, R.x0 + 3, R.y0 + 3, R.x1 - R.x0 - 6, R.y1 - R.y0 - 6, '#1f2b52');
  rect(g, R.x0 + 6, R.y0 + 6, R.x1 - R.x0 - 12, R.y1 - R.y0 - 12, '#a3262b');
  for (let x = R.x0 + 4; x < R.x1 - 4; x += 4) { rect(g, x, R.y0 + 4, 2, 1, '#e6d3a3'); rect(g, x + 2, R.y1 - 5, 2, 1, '#e6d3a3'); }
  for (let y = R.y0 + 6; y < R.y1 - 6; y += 4) { rect(g, R.x0 + 4, y, 1, 2, '#e6d3a3'); rect(g, R.x1 - 5, y + 2, 1, 2, '#e6d3a3'); }

  const n = W * H; LUM = new Float32Array(n); TR = new Float32Array(n); TG = new Float32Array(n); TB = new Float32Array(n);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let l = AMB.i, r = AMB.i * AMB.c[0], gg = AMB.i * AMB.c[1], b = AMB.i * AMB.c[2];
    const sx = x - OX, sy = y - OY;
    for (const Lg of LIGHTS) { const d = Math.hypot(sx - Lg.x, (sy - Lg.y) * 1.15); if (d < Lg.r) { const f = Math.pow(1 - d / Lg.r, 1.5) * Lg.i; l += f; r += f * Lg.c[0]; gg += f * Lg.c[1]; b += f * Lg.c[2]; } }
    const i = y * W + x; LUM[i] = l; TR[i] = r / l; TG[i] = gg / l; TB[i] = b / l;
  }
}

/* night view outside the window, animated snow */
const [NIGHT, ng] = mk(40, 60);
const BLOCKS = []; for (let i = 0; i < 5; i++) { const w = 9 + (Math.random() * 8 | 0), x = i * 9 - 3, h = 20 + (Math.random() * 28 | 0), lit = []; for (let yy = 60 - h + 3; yy < 56; yy += 4) for (let xx = x + 2; xx < x + w - 1; xx += 3) lit.push([xx, yy, Math.random() < .35]); BLOCKS.push({ x, w, h, lit }); }
const FLAKES = Array.from({ length: 34 }, () => [Math.random() * 40, Math.random() * 60, .3 + Math.random() * .7]);
let NIGHTD = null;
function drawNight(t) {
  for (let y = 0; y < 60; y++) rect(ng, 0, y, 40, 1, `rgb(${14 + y * .5 | 0},${19 + y * .4 | 0},${48 + y * .7 | 0})`);
  rect(ng, 30, 6, 4, 4, '#f3e7c9'); rect(ng, 31, 5, 2, 6, '#f3e7c9');
  BLOCKS.forEach(b => { rect(ng, b.x, 60 - b.h, b.w, b.h, '#262a3e'); rect(ng, b.x, 60 - b.h, b.w, 1, '#dfe6f7'); b.lit.forEach(([x, y, on]) => rect(ng, x, y, 2, 2, on ? '#ffcf6a' : '#181b28')); });
  rect(ng, 0, 57, 40, 3, '#cfd8ee');
  FLAKES.forEach(f => { f[1] += f[2] * .7; f[0] += Math.sin(t + f[1] * .2) * .2; if (f[1] > 60) { f[1] = 0; f[0] = Math.random() * 40; } dot(ng, f[0], f[1], '#ffffff'); });
  NIGHTD = ng.getImageData(0, 0, 40, 60).data;
}
const MON = Array.from({ length: 24 }, () => [1 + (Math.random() * 3 | 0), 6 + (Math.random() * 16 | 0), Math.random() < .2]);

/* ---- bubbles ---- */
const mb = $('#m-bubble'); let mbT = 0;
function say(text, s = 2.2) { mb.textContent = text; mb.classList.add('on'); mbT = s; }
GUESTS.forEach(G => { const b = document.createElement('div'); b.className = 'bubble small'; $('#c-bubbles').appendChild(b); G.bubble = b; });
const toCss = (sx, sy) => [sx * SC / DPR, sy * SC / DPR];

/* ---- pointer ---- */
const par = { x: 0, y: 0, tx: 0, ty: 0 }; let ptr = null, hoverSaid = 0;
canvas.addEventListener('pointermove', e => { ptr = [e.clientX, e.clientY]; par.tx = e.clientX / innerWidth * 2 - 1; par.ty = e.clientY / innerHeight * 2 - 1; });
canvas.addEventListener('pointerleave', () => { ptr = null; par.tx = par.ty = 0; });
function overDverka(cx, cy) {
  const pl = Math.round(par.x * 5), ql = Math.round(par.y * 2.5);
  const sx = cx * DPR / SC - OX - pl, sy = cy * DPR / SC - OY - ql;
  return sx > DV.x - 10 && sx < DV.x + 10 && sy > DV.y - 25 && sy < DV.y + 3;
}
const CLICK = ['Тук-тук!', 'Туда пока нельзя. Скоро!', 'Там темно… но уютно', 'Эй, щекотно!', 'Я Дверка!', 'Скрип-скрип'];
canvas.addEventListener('click', e => {
  if (!overDverka(e.clientX, e.clientY)) return;
  say(CLICK[Math.floor(Math.random() * CLICK.length)]); $('#hint').hidden = true;
  if (DV.mode !== 'jump') { DV.queue.unshift({ x: DV.x, y: DV.y }); startJump({ x: DV.x, y: DV.y }); DV.jump.h = 14; DV.jump.d = .35; }
});
document.querySelectorAll('#rip button').forEach(b => {
  b.classList.toggle('on', (b.dataset.r === '1') === rip);
  b.addEventListener('click', () => { rip = b.dataset.r === '1'; try { localStorage.setItem('dverka.rip', rip ? '1' : '0'); } catch (e) {} document.querySelectorAll('#rip button').forEach(x => x.classList.toggle('on', x === b)); });
});

/* ---- frame ---- */
let last = performance.now(), nightT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000), t = now / 1000; last = now;
  par.x += (par.tx - par.x) * Math.min(1, dt * 4); par.y += (par.ty - par.y) * Math.min(1, dt * 4);
  DV.hover = ptr ? overDverka(ptr[0], ptr[1]) : false;
  canvas.classList.toggle('hot', DV.hover);
  if (DV.hover && now - hoverSaid > 6000) { hoverSaid = now; say('Скри-и-ип… там пока темно'); }
  updateDverka(dt);
  // guests
  GUESTS.forEach(G => {
    G.blinkT -= dt; G.t.blink = G.blinkT < 0; if (G.blinkT < -.14) G.blinkT = 2 + Math.random() * 4;
    G.actT -= dt; if (G.actT < 0) { G.t.act = G.t.act ? 0 : 1; G.actT = G.t.act ? 1.4 : 2.5 + Math.random() * 4; }
    G.t.bob = Math.sin(t * 1.6 + G.cx) > .6 ? 1 : 0;
    G.talkT -= dt; if (G.talkT < 0) { G.talkT = 7 + Math.random() * 9; G.bubble.textContent = G.lines[Math.floor(Math.random() * G.lines.length)]; G.bubble.classList.add('on'); G.bubbleT = 2.4; }
    G.bubbleT -= dt; if (G.bubbleT <= 0) G.bubble.classList.remove('on');
  });
  CAT.blinkT -= dt; CAT.blink = CAT.blinkT < 0; if (CAT.blinkT < -.15) CAT.blinkT = 2 + Math.random() * 3;
  CAT.lookT -= dt; if (CAT.lookT < 0) { CAT.look = CAT.look ? 0 : 1; CAT.lookT = 1.5 + Math.random() * 3; }

  const pb = Math.round(par.x * 1.5), pc = Math.round(par.x * 2.5), pt = Math.round(par.x * 3.5), pl = Math.round(par.x * 5);
  const qb = Math.round(par.y * 1), qt = Math.round(par.y * 1.8), ql = Math.round(par.y * 2.5);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(backC, -M + pb, -M + qb);
  ctx.save(); ctx.translate(OX + pc, OY + qb); GUESTS.forEach(G => drawGuest(ctx, G, t)); ctx.restore();
  ctx.drawImage(tableC, -M + pt, -M + qt);
  ctx.save(); ctx.translate(OX + pt, OY + qt); GUESTS.forEach(G => drawArms(ctx, G, t)); drawCat(ctx, t); ctx.restore();
  ctx.drawImage(lettersC, -M + pl, -M + ql);
  ctx.save(); ctx.translate(OX + pl, OY + ql); drawDverka(ctx, t); ctx.restore();

  // light: quantised with an ordered dither — the “рябь”
  const img = ctx.getImageData(0, 0, W, H), d = img.data, flick = 1 + Math.sin(t * 7) * .012;
  for (let y = 0; y < H; y++) {
    const by = (y & 3) * 4;
    for (let x = 0; x < W; x++) {
      const i = y * W + x, j = i * 4, L = LUM[i] * flick;
      const q = rip ? Math.floor(L * 5 + BAY[by + (x & 3)]) / 5 : L;
      d[j] = Math.min(255, d[j] * q * TR[i]); d[j + 1] = Math.min(255, d[j + 1] * q * TG[i]); d[j + 2] = Math.min(255, d[j + 2] * q * TB[i]);
    }
  }
  ctx.putImageData(img, 0, 0);
  ctx.save(); ctx.translate(OX + pc, OY + qb);
  GUESTS.forEach(G => { const f = G.id === 'bag' ? (G.t.blink ? FACES.bag1 : FACES.bag0) : G.lit, sh = G.id === 'troll2' && G.t.act ? (Math.floor(t * 20) % 2) : 0; ctx.drawImage(f, Math.round(G.cx - f.width / 2), Math.round(124 - f.height + G.t.bob - sh)); });
  ctx.restore();

  // things that glow on their own
  ctx.save(); ctx.translate(OX + pb, OY + qb);
  if ((nightT -= dt) < 0) { nightT = .1; drawNight(t); }
  for (let x = Math.ceil(WIN.xl); x < WIN.xr; x++) {
    const y0 = Math.ceil(WIN.tq(x)), y1 = Math.floor(WIN.bq(x)), u = (x - WIN.xl) / (WIN.xr - WIN.xl);
    for (let y = y0; y < y1; y++) { const v = (y - y0) / (y1 - y0), k = ((v * 59 | 0) * 40 + (u * 39 | 0)) * 4; ctx.fillStyle = `rgb(${NIGHTD[k]},${NIGHTD[k + 1]},${NIGHTD[k + 2]})`; ctx.fillRect(x, y, 1, 1); }
  }
  const xm = (WIN.xl + WIN.xr) / 2; line(ctx, xm, WIN.tq(xm), xm, WIN.bq(xm), '#8f8b82'); line(ctx, WIN.xl, (WIN.tq(WIN.xl) + WIN.bq(WIN.xl)) * .42, WIN.xr, (WIN.tq(WIN.xr) + WIN.bq(WIN.xr)) * .42, '#8f8b82');
  rect(ctx, 303, 112, 25, 20, '#dfe9d6'); rect(ctx, 303, 112, 25, 2, '#7a9a6a');
  const off = (t * 3 | 0) % 24; for (let i = 0; i < 8; i++) { const [x, w, pic] = MON[(i + off) % 24], y = 115 + i * 2; if (pic) { rect(ctx, 304 + x, y, 3, 2, '#9fb4c6'); rect(ctx, 308 + x, y, w - 4, 1, '#6a8a6a'); } else rect(ctx, 304 + x, y, w, 1, i % 3 ? '#4a5a4a' : '#b84a4a'); }
  const cols = ['#ff5a5a', '#ffd46a', '#6fdc8c', '#6ab8ff', '#e79bff'];
  GARLAND.forEach(([x, y, n]) => { const on = Math.sin(t * 2.4 + n * 1.7) > -.3; rect(ctx, x, y, 2, 2, on ? cols[n % 5] : '#3a3040'); if (on && rip) { dot(ctx, x - 1, y, cols[n % 5] + '66'); dot(ctx, x + 2, y + 1, cols[n % 5] + '66'); } });
  TREE_LIGHTS.forEach(([x, y, n]) => { if (Math.sin(t * 3 + n * 2.1) > -.2) dot(ctx, x, y, cols[n % 5]); });
  rect(ctx, 79, 82, 3, 3, '#ffe38a'); dot(ctx, 80, 81, '#fff6c8');
  [[183, 16], [192, 17], [201, 16]].forEach(([x, y]) => { rect(ctx, x - 1, y - 1, 3, 3, '#fff1c9'); dot(ctx, x, y - 2, '#fff8e0'); });
  ctx.restore();
  ctx.save(); ctx.translate(OX + pt, OY + qt);
  rect(ctx, 273, 131 - (Math.random() < .3 ? 1 : 0), 2, 3, '#ffcf5a'); dot(ctx, 273, 130, '#fff3c0');
  ctx.restore();

  // bubbles
  GUESTS.forEach(G => { const [x, y] = toCss(G.cx + OX + pc, 78 + OY + qb); G.bubble.style.left = x + 'px'; G.bubble.style.top = y + 'px'; });
  mbT -= dt; if (mbT <= 0) mb.classList.remove('on');
  const [mx, my] = toCss(DV.x + OX + pl, DV.y - 24 + OY + ql); mb.style.left = mx + 'px'; mb.style.top = my + 'px';
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize(); drawNight(0);
setTimeout(() => say('Привет! Я Дверка', 3), 600);
requestAnimationFrame(frame);

</script>

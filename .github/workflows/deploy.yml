name: Deploy dverka.sk

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  HOST: 82.21.150.38
  USER: site-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Prepare ssh
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          SITE_KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
        run: |
          [ -n "$SITE_DEPLOY_KEY" ] || { echo "::error::secret SITE_DEPLOY_KEY is not set"; exit 1; }
          [ -n "$SITE_KNOWN_HOSTS" ] || { echo "::error::secret SITE_KNOWN_HOSTS is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # values pasted on Windows may carry \r, which ssh refuses to parse
          printf '%s\n' "$SITE_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$SITE_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/deploy_key && hdr=yes || hdr=no
            echo "::error::SITE_DEPLOY_KEY is not a readable private key ($(wc -l < ~/.ssh/deploy_key) lines, private key header: $hdr)"
            exit 1
          fi

      # The key is pinned to rrsync on the server, so the target path is
      # relative to /var/www/dverka.sk and nothing outside it is reachable
      - name: Upload site/
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            site/ "$USER@$HOST:./"

      - name: Check it is served
        run: |
          curl -fsS -o /dev/null --resolve "dverka.sk:443:$HOST" https://dverka.sk/

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key

name: WakaTime cards

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate cards
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python scripts/wakatime_cards.py
      - name: Render the playlist player
        # Yandex Music blocks GitHub runners (HTTP 451): tracks come from cards/playlist.json,
        # refreshed locally with `python scripts/yandex_playlist.py --sync`
        run: |
          pip install --quiet pillow
          python scripts/yandex_playlist.py
      - name: Collect Steam screenshots
        # Steam can hiccup; the album just keeps the previous JSON then
        continue-on-error: true
        run: python scripts/steam_shots.py
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards README.md
          git diff --cached --quiet || (git commit -m "Update WakaTime cards and Steam screenshots" && git push)
